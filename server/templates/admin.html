<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>授权中心管理后台</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel2: #1c2230;
      --line: #2d3748;
      --text: #f0f6fc;
      --muted: #8b949e;
      --accent: #2f81f7;
      --accent2: #58a6ff;
      --green: #3fb950;
      --gold: #d29922;
      --red: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      background:
        radial-gradient(1200px 500px at 50% -100px, rgba(47,129,247,.12), transparent 60%),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 60px; }

    /* 顶栏 */
    .topbar {
      display: flex; align-items: center; gap: 14px; padding: 16px 22px;
      background: rgba(22,27,34,.8); border: 1px solid var(--line); border-radius: 14px;
      margin-bottom: 22px; backdrop-filter: blur(8px);
    }
    .topbar .logo {
      width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #1158c7); font-weight: 800; color: #fff;
      box-shadow: 0 4px 16px rgba(47,129,247,.35);
    }
    .topbar h1 { margin: 0; font-size: 18px; }
    .topbar .muted { color: var(--muted); font-size: 12px; }
    .spacer { flex: 1; }
    .btn {
      padding: 8px 16px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--panel2); color: var(--text); font: inherit; font-size: 13px;
      font-weight: 700; cursor: pointer; transition: all .15s;
    }
    .btn:hover { border-color: var(--accent); color: #fff; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: #3b8af5; }
    .btn.danger { color: var(--red); }
    .btn.danger:hover { border-color: var(--red); }
    .btn.sm { padding: 5px 10px; font-size: 12px; }

    /* 统计卡 */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 22px; }
    .stat {
      padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
    }
    .stat .num { font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
    .stat .lbl { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .stat.green .num { color: var(--green); }
    .stat.blue .num { color: var(--accent2); }
    .stat.gold .num { color: var(--gold); }
    .stat.red .num { color: var(--red); }

    /* 卡片 */
    .card {
      padding: 20px; margin-bottom: 16px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    }
    .card h2 { margin: 0 0 14px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .card h2 .hint { color: var(--muted); font-size: 12px; font-weight: 400; }

    /* 表格 */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #242f3e; vertical-align: top; }
    th { color: var(--muted); background: rgba(28,34,48,.5); font-weight: 700; font-size: 12px; }
    tr:hover td { background: rgba(47,129,247,.04); }
    .muted { color: var(--muted); font-size: 12px; }
    .mono { font-family: Consolas, monospace; font-size: 12px; color: var(--accent2); word-break: break-all; }

    /* 徽章 */
    .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .badge.ok { background: rgba(63,185,80,.15); color: var(--green); }
    .badge.off { background: rgba(248,81,73,.15); color: var(--red); }
    .badge.gold { background: rgba(210,153,34,.15); color: var(--gold); }
    .badge.blue { background: rgba(47,129,247,.15); color: var(--accent2); }

    /* 登录框 */
    #loginBox { max-width: 400px; margin: 90px auto; }
    #loginBox .brand { text-align: center; margin-bottom: 20px; }
    #loginBox .brand .logo { width: 56px; height: 56px; margin: 0 auto 12px; display: grid; place-items: center;
      border-radius: 14px; background: linear-gradient(135deg, var(--accent), #1158c7); font-size: 24px; font-weight: 800; color: #fff; }
    input {
      width: 100%; padding: 10px 12px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--bg); color: var(--text); font: inherit; outline: none;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,129,247,.15); }

    .notice { display: none; margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.6; }
    .notice.show { display: block; }
    .notice.ok { background: rgba(63,185,80,.12); color: var(--green); border: 1px solid rgba(63,185,80,.3); }
    .notice.err { background: rgba(248,81,73,.12); color: var(--red); border: 1px solid rgba(248,81,73,.3); }
    .machine-chip {
      display: inline-block; margin: 2px 4px 2px 0; padding: 2px 8px; border-radius: 6px;
      background: rgba(47,129,247,.08); color: var(--accent2); font-size: 11px; font-family: Consolas, monospace;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- 登录 -->
    <div id="loginBox" class="card">
      <div class="brand">
        <div class="logo">影</div>
        <h1 style="margin:0;font-size:22px;">授权中心管理后台</h1>
        <p class="muted" style="margin:6px 0 0;">仅管理员可登录</p>
      </div>
      <input id="loginUser" placeholder="管理员账号" autocomplete="username">
      <input id="loginPass" type="password" placeholder="密码" autocomplete="current-password">
      <button id="loginBtn" class="btn primary" style="width:100%">登录</button>
      <div id="loginNotice" class="notice"></div>
    </div>

    <!-- 主界面 -->
    <div id="mainBox" style="display:none">
      <div class="topbar">
        <div class="logo">影</div>
        <div>
          <h1>授权中心管理后台</h1>
          <div class="muted" id="whoami"></div>
        </div>
        <div class="spacer"></div>
        <button id="refreshBtn" class="btn">刷新列表</button>
        <button id="logoutBtn" class="btn danger">退出登录</button>
      </div>

      <div class="stats" id="statsRow"></div>

      <div class="card">
        <h2>客户与授权管理 <span class="hint">开通 / 续期 / 吊销 / 解绑</span></h2>
        <div id="notice" class="notice"></div>
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th>账号</th><th>状态</th><th>授权</th><th>到期时间</th>
                <th>机器</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    let token = localStorage.getItem("album_admin_token") || "";

    function notice(el, msg, isErr) {
      el.textContent = msg;
      el.className = `notice show ${isErr ? "err" : "ok"}`;
    }

    async function api(url, options = {}) {
      const headers = Object.assign({ "Content-Type": "application/json" }, options.headers || {});
      if (token) headers.Authorization = `Bearer ${token}`;
      const resp = await fetch(url, Object.assign({}, options, { headers }));
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok || data.ok === false) throw new Error(data.error || `请求失败(${resp.status})`);
      return data;
    }

    $("#loginBtn").addEventListener("click", async () => {
      try {
        const data = await api("/api/login", {
          method: "POST",
          body: JSON.stringify({ username: $("#loginUser").value.trim(), password: $("#loginPass").value })
        });
        if (data.account.role !== "admin") throw new Error("该账号不是管理员");
        token = data.token;
        localStorage.setItem("album_admin_token", token);
        enterAdmin(data.account);
      } catch (e) {
        notice($("#loginNotice"), e.message, true);
      }
    });

    function enterAdmin(account) {
      $("#loginBox").style.display = "none";
      $("#mainBox").style.display = "block";
      $("#whoami").textContent = `当前管理员：${account.display_name || account.username}`;
      loadAccounts();
    }

    async function loadAccounts() {
      try {
        const data = await api("/api/admin/accounts");
        renderStats(data.accounts);
        renderAccounts(data.accounts);
      } catch (e) {
        notice($("#notice"), e.message, true);
        if (/登录|权限/.test(e.message)) {
          token = "";
          localStorage.removeItem("album_admin_token");
          $("#mainBox").style.display = "none";
          $("#loginBox").style.display = "block";
        }
      }
    }

    function renderStats(accounts) {
      const total = accounts.length;
      const members = accounts.filter(a => a.license && a.license.has_license).length;
      const lifetime = accounts.filter(a => a.license && a.license.license_type === "lifetime").length;
      const machines = accounts.reduce((s, a) => s + ((a.license && a.license.machine_count) || 0), 0);
      const stats = [
        { cls: "blue", num: total, lbl: "总账号数" },
        { cls: "green", num: members, lbl: "会员账号" },
        { cls: "gold", num: lifetime, lbl: "终身会员" },
        { cls: "red", num: machines, lbl: "已绑定机器" },
      ];
      $("#statsRow").innerHTML = stats.map(s =>
        `<div class="stat ${s.cls}"><div class="num">${s.num}</div><div class="lbl">${s.lbl}</div></div>`
      ).join("");
    }

    function renderAccounts(accounts) {
      $("#rows").innerHTML = accounts.map(({ account, license }) => {
        const lic = license || {};
        const typeText = lic.has_license
          ? (lic.license_type === "lifetime" ? "终身" : "限期")
          : "未开通";
        const typeCls = lic.has_license ? (lic.license_type === "lifetime" ? "gold" : "blue") : "off";
        const expText = lic.license_type === "lifetime" ? "终身" : (lic.expires_at || "-");
        const machineText = `${lic.machine_count || 0}/${lic.machine_limit || 3} 台`;
        const machines = (lic.machines || []).map(m => `<span class="machine-chip">${escapeHtml(m.machine_id.slice(-8))}</span>`).join("");
        const machineButtons = (lic.machines || []).map(m =>
          `<button class="btn sm" data-action="unbind" data-account="${account.id}" data-machine="${escapeAttr(m.machine_id)}">解绑 ${escapeHtml(m.machine_id.slice(-6))}</button>`
        ).join(" ");
        return `<tr>
          <td><strong>${escapeHtml(account.username)}</strong><br><span class="muted">${escapeHtml(account.display_name || "")}</span></td>
          <td><span class="badge ${account.status === "active" ? "ok" : "off"}">${account.status === "active" ? "正常" : "停用"}</span></td>
          <td><span class="badge ${typeCls}">${typeText}</span></td>
          <td class="mono">${escapeHtml(expText)}</td>
          <td><span class="muted">${machineText}</span><br>${machines || '<span class="muted">-</span>'}</td>
          <td>
            <button class="btn sm" data-action="license" data-account="${account.id}" data-user="${escapeAttr(account.username)}">开通/续期</button>
            <button class="btn sm danger" data-action="revoke" data-account="${account.id}">吊销</button>
            ${machineButtons}
          </td>
        </tr>`;
      }).join("");
    }

    function issueLicense(accountId, username) {
      const type = prompt(`为 ${username} 开通授权\n输入授权类型（term=限期, lifetime=终身）：`, "term");
      if (!type || (type !== "term" && type !== "lifetime")) return;
      let days = 90;
      let limit = 3;
      if (type === "term") {
        days = parseInt(prompt("授权天数：", "90"), 10) || 90;
      }
      limit = parseInt(prompt("可绑定电脑数（默认 3）：", "3"), 10) || 3;
      api("/api/admin/license", {
        method: "POST",
        body: JSON.stringify({ account_id: accountId, license_type: type, valid_days: days, machine_limit: limit })
      }).then(() => { notice($("#notice"), "授权已开通/更新"); loadAccounts(); })
        .catch(e => notice($("#notice"), e.message, true));
    }

    function revoke(accountId) {
      if (!confirm("吊销后该账号所有机器立即失效，确定？")) return;
      api("/api/admin/revoke", { method: "POST", body: JSON.stringify({ account_id: accountId }) })
        .then(() => { notice($("#notice"), "已吊销"); loadAccounts(); })
        .catch(e => notice($("#notice"), e.message, true));
    }

    function unbind(accountId, machineId) {
      if (!confirm(`解绑机器 ${machineId}？`)) return;
      api("/api/admin/unbind", { method: "POST", body: JSON.stringify({ account_id: accountId, machine_id: machineId }) })
        .then(() => { notice($("#notice"), "已解绑"); loadAccounts(); })
        .catch(e => notice($("#notice"), e.message, true));
    }

    $("#refreshBtn").addEventListener("click", loadAccounts);
    $("#logoutBtn").addEventListener("click", () => {
      token = "";
      localStorage.removeItem("album_admin_token");
      $("#mainBox").style.display = "none";
      $("#loginBox").style.display = "block";
    });
    $("#rows").addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-action]");
      if (!btn) return;
      const action = btn.getAttribute("data-action");
      const accountId = btn.getAttribute("data-account");
      const username = btn.getAttribute("data-user") || "";
      const machineId = btn.getAttribute("data-machine") || "";
      if (action === "license") issueLicense(Number(accountId), username);
      else if (action === "revoke") revoke(Number(accountId));
      else if (action === "unbind") unbind(Number(accountId), machineId);
    });

    function escapeHtml(v) {
      return String(v == null ? "" : v).replace(/[&<>"']/g, c => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }
    function escapeAttr(v) { return escapeHtml(v).replace(/"/g, "&quot;"); }

    (async () => {
      if (!token) return;
      try {
        const data = await api("/api/me");
        if (data.account.role === "admin") enterAdmin(data.account);
        else { token = ""; localStorage.removeItem("album_admin_token"); }
      } catch (e) { token = ""; localStorage.removeItem("album_admin_token"); }
    })();
  </script>
</body>
</html>
