<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>授权中心管理后台</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel2: #1c2230;
      --line: #2d3748;
      --text: #f0f6fc;
      --muted: #8b949e;
      --accent: #2f81f7;
      --accent2: #58a6ff;
      --green: #3fb950;
      --gold: #d29922;
      --red: #f85149;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      background:
        radial-gradient(1200px 500px at 50% -100px, rgba(47,129,247,.12), transparent 60%),
        var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 60px; }

    /* 顶栏 */
    .topbar {
      display: flex; align-items: center; gap: 14px; padding: 16px 22px;
      background: rgba(22,27,34,.8); border: 1px solid var(--line); border-radius: 14px;
      margin-bottom: 22px; backdrop-filter: blur(8px);
    }
    .topbar .logo {
      width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #1158c7); font-weight: 800; color: #fff;
      box-shadow: 0 4px 16px rgba(47,129,247,.35);
    }
    .topbar h1 { margin: 0; font-size: 18px; }
    .topbar .muted { color: var(--muted); font-size: 12px; }
    .spacer { flex: 1; }
    .btn {
      padding: 8px 16px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--panel2); color: var(--text); font: inherit; font-size: 13px;
      font-weight: 700; cursor: pointer; transition: transform 140ms cubic-bezier(.23,1,.32,1), border-color 160ms ease, background-color 160ms ease, color 160ms ease;
    }
    .btn:active { transform: scale(.97); }
    @media (hover:hover) and (pointer:fine) { .btn:hover { border-color: var(--accent); color: #fff; } }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: #3b8af5; }
    .btn.danger { color: var(--red); }
    .btn.danger:hover { border-color: var(--red); }
    .btn.sm { padding: 5px 10px; font-size: 12px; }

    /* 统计卡 */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 22px; }
    .stat {
      padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
    }
    .stat .num { font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
    .stat .lbl { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .stat.green .num { color: var(--green); }
    .stat.blue .num { color: var(--accent2); }
    .stat.gold .num { color: var(--gold); }
    .stat.red .num { color: var(--red); }

    /* 卡片 */
    .card {
      padding: 20px; margin-bottom: 16px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    }
    .card h2 { margin: 0 0 14px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
    .card h2 .hint { color: var(--muted); font-size: 12px; font-weight: 400; }

    /* 表格 */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #242f3e; vertical-align: top; }
    th { color: var(--muted); background: rgba(28,34,48,.5); font-weight: 700; font-size: 12px; }
    tr:hover td { background: rgba(47,129,247,.04); }
    .muted { color: var(--muted); font-size: 12px; }
    .mono { font-family: Consolas, monospace; font-size: 12px; color: var(--accent2); word-break: break-all; }

    /* 徽章 */
    .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
    .badge.ok { background: rgba(63,185,80,.15); color: var(--green); }
    .badge.off { background: rgba(248,81,73,.15); color: var(--red); }
    .badge.gold { background: rgba(210,153,34,.15); color: var(--gold); }
    .badge.blue { background: rgba(47,129,247,.15); color: var(--accent2); }

    /* 登录框 */
    #loginBox { max-width: 400px; margin: 90px auto; }
    #loginBox .brand { text-align: center; margin-bottom: 20px; }
    #loginBox .brand .logo { width: 56px; height: 56px; margin: 0 auto 12px; display: grid; place-items: center;
      border-radius: 14px; background: linear-gradient(135deg, var(--accent), #1158c7); font-size: 24px; font-weight: 800; color: #fff; }
    input {
      width: 100%; padding: 10px 12px; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 8px;
      background: var(--bg); color: var(--text); font: inherit; outline: none;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,129,247,.15); }

    .notice { display: none; margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.6; }
    .notice.show { display: block; }
    .notice.ok { background: rgba(63,185,80,.12); color: var(--green); border: 1px solid rgba(63,185,80,.3); }
    .notice.err { background: rgba(248,81,73,.12); color: var(--red); border: 1px solid rgba(248,81,73,.3); }
    .machine-chip {
      display: inline-block; margin: 2px 4px 2px 0; padding: 2px 8px; border-radius: 6px;
      background: rgba(47,129,247,.08); color: var(--accent2); font-size: 11px; font-family: Consolas, monospace;
    }
    .admin-grid { display:grid; grid-template-columns:repeat(4,minmax(140px,1fr)); gap:12px; }
    .admin-grid label { color:var(--muted); font-size:12px; }
    .admin-grid input, .admin-grid select { margin:6px 0 0; }
    .admin-grid .wide { grid-column:1/-1; }
    .check { display:flex; align-items:center; gap:8px; color:var(--text); font-size:13px; }
    .check input { width:auto; margin:0; }
    .toolbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
    .toolbar input, .toolbar select { width:auto; min-width:160px; margin:0; }
    details summary { cursor:pointer; color:var(--accent2); }
    pre { white-space:pre-wrap; word-break:break-word; max-width:520px; color:var(--muted); font:11px/1.6 Consolas,monospace; }
    dialog { width:min(520px,calc(100vw - 32px)); color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px; }
    dialog::backdrop { background:rgba(0,0,0,.62); }
    dialog h2 { margin-top:0; }
    @media (max-width:800px) { .admin-grid { grid-template-columns:1fr 1fr; } .wrap { padding:14px 10px 40px; } }
    @media (max-width:520px) { .admin-grid { grid-template-columns:1fr; } .topbar { flex-wrap:wrap; } }
    @media (prefers-reduced-motion:reduce) { .btn { transition:color 120ms ease, background-color 120ms ease; } .btn:active { transform:none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- 登录 -->
    <div id="loginBox" class="card">
      <div class="brand">
        <div class="logo">影</div>
        <h1 style="margin:0;font-size:22px;">授权中心管理后台</h1>
        <p class="muted" style="margin:6px 0 0;">仅管理员可登录</p>
      </div>
      <input id="loginUser" placeholder="管理员账号" autocomplete="username">
      <input id="loginPass" type="password" placeholder="密码" autocomplete="current-password">
      <button id="loginBtn" class="btn primary" style="width:100%">登录</button>
      <div id="loginNotice" class="notice"></div>
    </div>

    <!-- 主界面 -->
    <div id="mainBox" style="display:none">
      <div class="topbar">
        <div class="logo">影</div>
        <div>
          <h1>授权中心管理后台</h1>
          <div class="muted" id="whoami"></div>
        </div>
        <div class="spacer"></div>
        <button id="refreshBtn" class="btn">刷新列表</button>
        <button id="logoutBtn" class="btn danger">退出登录</button>
      </div>

      <div class="stats" id="statsRow"></div>

      <div class="card">
        <h2>客户与授权管理 <span class="hint">开通 / 续期 / 吊销 / 解绑</span></h2>
        <div id="notice" class="notice"></div>
        <div style="overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th>账号</th><th>状态</th><th>授权</th><th>到期时间</th>
                <th>邀请</th><th>机器</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h2>产品策略 <span class="hint">客户端自动同步，断网使用最近缓存</span></h2>
        <form id="productForm" class="admin-grid">
          <label>月度会员价格<input id="cfgMonthly" type="number" min="1" max="9999"></label>
          <label>终身会员价格<input id="cfgLifetime" type="number" min="1" max="99999"></label>
          <label>价格标签<input id="cfgPriceLabel" maxlength="40"></label>
          <label>免费照片上限<input id="cfgFreeLimit" type="number" min="0" max="100000"></label>
          <label>有效邀请门槛<input id="cfgInviteMilestone" type="number" min="1" max="1000"></label>
          <label>每次奖励天数<input id="cfgInviteDays" type="number" min="0" max="3650"></label>
          <label>云图最长边(px)<input id="cfgThumbSide" type="number" min="320" max="1600"></label>
          <label>云图质量(40~92)<input id="cfgThumbQuality" type="number" min="40" max="92"></label>
          <label>每项目云图上限<input id="cfgThumbCount" type="number" min="1" max="1000"></label>
          <label class="check"><input id="cfgBetaCloud" type="checkbox">内测期免费账号可用云预览</label>
          <label class="check"><input id="cfgLogging" type="checkbox">接收客户端错误日志</label>
          <div class="wide"><button class="btn primary" type="submit">保存并下发策略</button> <span id="configVersion" class="muted"></span></div>
        </form>
      </div>

      <div class="card">
        <h2>客户端错误中心 <span class="hint" id="errorSummary">正在读取</span></h2>
        <div class="toolbar">
          <select id="errorStatus"><option value="0">未处理</option><option value="">全部</option><option value="1">已处理</option></select>
          <input id="errorSearch" placeholder="搜索账号、模块或错误内容">
          <button id="errorSearchBtn" class="btn" type="button">查询</button>
        </div>
        <div style="overflow-x:auto">
          <table>
            <thead><tr><th>时间</th><th>级别</th><th>来源/账号</th><th>错误</th><th>状态</th><th>操作</th></tr></thead>
            <tbody id="errorRows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <dialog id="licenseDialog">
    <form id="licenseForm" method="dialog">
      <h2>开通或调整会员</h2>
      <p class="muted" id="licenseAccountText"></p>
      <input id="licenseAccountId" type="hidden">
      <label>授权类型<select id="licenseType" style="width:100%;padding:10px 12px;margin:6px 0 12px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;"><option value="term">限期会员</option><option value="lifetime">终身会员</option></select></label>
      <label id="licenseDaysLabel">有效天数<input id="licenseDays" type="number" min="1" max="3650" value="30"></label>
      <label>可绑定电脑数<input id="licenseLimit" type="number" min="1" max="100" value="3"></label>
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:8px;"><button id="cancelLicenseBtn" class="btn" type="button">取消</button><button class="btn primary" type="submit">确认开通</button></div>
    </form>
  </dialog>

  <script>
    const $ = (s) => document.querySelector(s);
    let token = localStorage.getItem("album_admin_token") || "";

    function reportError(message, context = {}, stack = "", severity = "error") {
      fetch("/api/client-errors", {
        method: "POST",
        headers: { "Content-Type": "application/json", ...(token ? { "Authorization": `Bearer ${token}` } : {}) },
        body: JSON.stringify({ source: "admin_web", message, context, stack, severity, app_version: "web" }),
        keepalive: true
      }).catch(() => {});
    }
    window.addEventListener("error", (event) => reportError(event.message, {
      filename: String(event.filename || "").split(/[\\/]/).pop(), line: event.lineno, column: event.colno
    }, event.error?.stack || ""));
    window.addEventListener("unhandledrejection", (event) => reportError(
      event.reason?.message || String(event.reason || "未处理的异步错误"),
      { kind: "unhandledrejection" }, event.reason?.stack || ""
    ));

    function notice(el, msg, isErr) {
      el.textContent = msg;
      el.className = `notice show ${isErr ? "err" : "ok"}`;
    }

    async function api(url, options = {}) {
      const headers = Object.assign({ "Content-Type": "application/json" }, options.headers || {});
      if (token) headers.Authorization = `Bearer ${token}`;
      let resp;
      try {
        resp = await fetch(url, Object.assign({}, options, { headers }));
      } catch (error) {
        reportError(error.message || "网络请求失败", { url, method: options.method || "GET" }, error.stack || "", "warning");
        throw error;
      }
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok || data.ok === false) {
        reportError(data.error || `请求失败(${resp.status})`, { url, method: options.method || "GET", status: resp.status }, "", resp.status >= 500 ? "error" : "warning");
        throw new Error(data.error || `请求失败(${resp.status})`);
      }
      return data;
    }

    $("#loginBtn").addEventListener("click", async () => {
      try {
        const data = await api("/api/login", {
          method: "POST",
          body: JSON.stringify({ username: $("#loginUser").value.trim(), password: $("#loginPass").value })
        });
        if (data.account.role !== "admin") throw new Error("该账号不是管理员");
        token = data.token;
        localStorage.setItem("album_admin_token", token);
        enterAdmin(data.account);
      } catch (e) {
        notice($("#loginNotice"), e.message, true);
      }
    });

    function enterAdmin(account) {
      $("#loginBox").style.display = "none";
      $("#mainBox").style.display = "block";
      $("#whoami").textContent = `当前管理员：${account.display_name || account.username}`;
      Promise.all([loadAccounts(), loadProductConfig(), loadErrors()]).catch(() => {});
    }

    async function loadAccounts() {
      try {
        const data = await api("/api/admin/accounts");
        renderStats(data.accounts);
        renderAccounts(data.accounts);
      } catch (e) {
        notice($("#notice"), e.message, true);
        if (/登录|权限/.test(e.message)) {
          token = "";
          localStorage.removeItem("album_admin_token");
          $("#mainBox").style.display = "none";
          $("#loginBox").style.display = "block";
        }
      }
    }

    function renderStats(accounts) {
      const total = accounts.length;
      const members = accounts.filter(a => a.license && a.license.has_license).length;
      const lifetime = accounts.filter(a => a.license && a.license.license_type === "lifetime").length;
      const machines = accounts.reduce((s, a) => s + ((a.license && a.license.machine_count) || 0), 0);
      const stats = [
        { cls: "blue", num: total, lbl: "总账号数" },
        { cls: "green", num: members, lbl: "会员账号" },
        { cls: "gold", num: lifetime, lbl: "终身会员" },
        { cls: "red", num: machines, lbl: "已绑定机器" },
      ];
      $("#statsRow").innerHTML = stats.map(s =>
        `<div class="stat ${s.cls}"><div class="num">${s.num}</div><div class="lbl">${s.lbl}</div></div>`
      ).join("");
    }

    function renderAccounts(accounts) {
      $("#rows").innerHTML = accounts.map(({ account, license, invite_code, invitees, invited_by, invite_count, invite_qualified_count }) => {
        const lic = license || {};
        const typeText = lic.has_license
          ? (lic.license_type === "lifetime" ? "终身" : "限期")
          : "未开通";
        const typeCls = lic.has_license ? (lic.license_type === "lifetime" ? "gold" : "blue") : "off";
        const expText = lic.license_type === "lifetime" ? "终身" : (lic.expires_at || "-");
        const machineText = `${lic.machine_count || 0}/${lic.machine_limit || 3} 台`;
        const machines = (lic.machines || []).map(m => `<span class="machine-chip">${escapeHtml(m.machine_id.slice(-8))}</span>`).join("");
        const machineButtons = (lic.machines || []).map(m =>
          `<button class="btn sm" data-action="unbind" data-account="${account.id}" data-machine="${escapeAttr(m.machine_id)}">解绑 ${escapeHtml(m.machine_id.slice(-6))}</button>`
        ).join(" ");
        // 邀请信息
        const inviteList = (invitees || []).length
          ? (invitees || []).map(item => `<span class="machine-chip" style="background:${item.status === "qualified" ? "rgba(63,185,80,.12)" : "rgba(210,153,34,.12)"};color:${item.status === "qualified" ? "var(--green)" : "var(--gold)"}">${escapeHtml(item.username)} · ${item.status === "qualified" ? "有效" : item.status === "rejected" ? "拒绝" : "待确认"}</span>`).join("")
          : '<span class="muted">-</span>';
        const invText = `邀请码：<span class="mono">${escapeHtml(invite_code || "-")}</span><br>` +
          `<span class="muted">注册 ${invite_count || 0} 人 / 有效 ${invite_qualified_count || 0} 人</span>${invited_by ? `<br><span class="muted">由 ${escapeHtml(invited_by)} 邀请</span>` : ""}`;
        return `<tr>
          <td><strong>${escapeHtml(account.username)}</strong><br><span class="muted">${escapeHtml(account.display_name || "")}</span></td>
          <td><span class="badge ${account.status === "active" ? "ok" : "off"}">${account.status === "active" ? "正常" : "停用"}</span></td>
          <td><span class="badge ${typeCls}">${typeText}</span></td>
          <td class="mono">${escapeHtml(expText)}</td>
          <td>${invText}<br>${inviteList}</td>
          <td><span class="muted">${machineText}</span><br>${machines || '<span class="muted">-</span>'}</td>
          <td>
            <button class="btn sm" data-action="license" data-account="${account.id}" data-user="${escapeAttr(account.username)}">开通/续期</button>
            <button class="btn sm danger" data-action="revoke" data-account="${account.id}">吊销</button>
            ${machineButtons}
          </td>
        </tr>`;
      }).join("");
    }

    function issueLicense(accountId, username) {
      $("#licenseAccountId").value = accountId;
      $("#licenseAccountText").textContent = `账号：${username}`;
      $("#licenseType").value = "term";
      $("#licenseDays").value = "30";
      $("#licenseLimit").value = "3";
      $("#licenseDaysLabel").style.display = "block";
      $("#licenseDialog").showModal();
    }

    $("#licenseType").addEventListener("change", () => {
      $("#licenseDaysLabel").style.display = $("#licenseType").value === "term" ? "block" : "none";
    });
    $("#cancelLicenseBtn").addEventListener("click", () => $("#licenseDialog").close());
    $("#licenseForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        await api("/api/admin/license", {
          method: "POST",
          body: JSON.stringify({
            account_id: Number($("#licenseAccountId").value),
            license_type: $("#licenseType").value,
            valid_days: Number($("#licenseDays").value || 30),
            machine_limit: Number($("#licenseLimit").value || 3)
          })
        });
        $("#licenseDialog").close();
        notice($("#notice"), "会员已开通或更新");
        loadAccounts();
      } catch (error) { notice($("#notice"), error.message, true); }
    });

    function revoke(accountId) {
      if (!confirm("吊销后该账号所有机器立即失效，确定？")) return;
      api("/api/admin/revoke", { method: "POST", body: JSON.stringify({ account_id: accountId }) })
        .then(() => { notice($("#notice"), "已吊销"); loadAccounts(); })
        .catch(e => notice($("#notice"), e.message, true));
    }

    function unbind(accountId, machineId) {
      if (!confirm(`解绑机器 ${machineId}？`)) return;
      api("/api/admin/unbind", { method: "POST", body: JSON.stringify({ account_id: accountId, machine_id: machineId }) })
        .then(() => { notice($("#notice"), "已解绑"); loadAccounts(); })
        .catch(e => notice($("#notice"), e.message, true));
    }

    async function loadProductConfig() {
      const data = await api("/api/product-config");
      const product = data.product || {};
      const pricing = product.pricing || {}, free = product.free || {}, invite = product.invite || {}, cloud = product.cloud_preview || {}, logging = product.logging || {};
      $("#cfgMonthly").value = pricing.monthly_price || 39;
      $("#cfgLifetime").value = pricing.lifetime_price || 399;
      $("#cfgPriceLabel").value = pricing.price_label || "原价";
      $("#cfgFreeLimit").value = free.photo_limit || 300;
      $("#cfgInviteMilestone").value = invite.milestone || 10;
      $("#cfgInviteDays").value = invite.reward_days || 30;
      $("#cfgThumbSide").value = cloud.thumb_max_side || 720;
      $("#cfgThumbQuality").value = cloud.thumb_quality || 76;
      $("#cfgThumbCount").value = cloud.max_thumbs_per_project || 240;
      $("#cfgBetaCloud").checked = Boolean(cloud.beta_free_access);
      $("#cfgLogging").checked = logging.enabled !== false;
      $("#configVersion").textContent = `配置版本 ${product.config_version || 1}`;
    }

    $("#productForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        const data = await api("/api/admin/product-config", {
          method: "POST",
          body: JSON.stringify({ product: {
            pricing: { monthly_price: Number($("#cfgMonthly").value), lifetime_price: Number($("#cfgLifetime").value), price_label: $("#cfgPriceLabel").value.trim() },
            free: { photo_limit: Number($("#cfgFreeLimit").value), upload_expiry_enabled: false, watermark_enabled: false },
            invite: { milestone: Number($("#cfgInviteMilestone").value), reward_days: Number($("#cfgInviteDays").value), enabled: true },
            cloud_preview: { thumb_max_side: Number($("#cfgThumbSide").value), thumb_quality: Number($("#cfgThumbQuality").value), max_thumbs_per_project: Number($("#cfgThumbCount").value), beta_free_access: $("#cfgBetaCloud").checked },
            logging: { enabled: $("#cfgLogging").checked }
          } })
        });
        $("#configVersion").textContent = `配置版本 ${data.product.config_version}`;
        notice($("#notice"), "产品策略已保存，客户端将在一小时内自动同步");
      } catch (error) { notice($("#notice"), error.message, true); }
    });

    async function loadErrors() {
      const status = $("#errorStatus").value;
      const q = $("#errorSearch").value.trim();
      const params = new URLSearchParams({ limit: "100" });
      if (status !== "") params.set("resolved", status);
      if (q) params.set("q", q);
      try {
        const data = await api(`/api/admin/errors?${params}`);
        const summary = data.summary || {};
        $("#errorSummary").textContent = `未处理 ${summary.unresolved || 0} 条，严重 ${summary.critical || 0} 条，共 ${summary.total || 0} 条`;
        $("#errorRows").innerHTML = (data.errors || []).map((item) => {
          const detail = [item.stack, JSON.stringify(item.context || {}, null, 2)].filter(Boolean).join("\n");
          const levelClass = item.severity === "critical" ? "off" : item.severity === "warning" ? "gold" : "blue";
          return `<tr><td class="mono">${escapeHtml(item.created_at || "-")}</td><td><span class="badge ${levelClass}">${escapeHtml(item.severity)}</span></td><td>${escapeHtml(item.source)}<br><span class="muted">${escapeHtml(item.username || "未登录")}</span></td><td><strong>${escapeHtml(item.error_type || "错误")}</strong><br>${escapeHtml(item.message || "-")}${detail ? `<details><summary>技术详情</summary><pre>${escapeHtml(detail)}</pre></details>` : ""}</td><td>${item.resolved ? '<span class="badge ok">已处理</span>' : '<span class="badge off">待处理</span>'}</td><td>${item.resolved ? "" : `<button class="btn sm" data-resolve-error="${item.id}">标记已处理</button>`}</td></tr>`;
        }).join("") || '<tr><td colspan="6" class="muted">暂无符合条件的错误记录</td></tr>';
      } catch (error) { $("#errorSummary").textContent = error.message; }
    }

    $("#errorSearchBtn").addEventListener("click", loadErrors);
    $("#errorStatus").addEventListener("change", loadErrors);
    $("#errorRows").addEventListener("click", async (event) => {
      const button = event.target.closest("button[data-resolve-error]");
      if (!button) return;
      try {
        await api(`/api/admin/errors/${button.dataset.resolveError}/resolve`, { method: "POST", body: JSON.stringify({ resolved: true }) });
        loadErrors();
      } catch (error) { notice($("#notice"), error.message, true); }
    });

    $("#refreshBtn").addEventListener("click", () => Promise.all([loadAccounts(), loadErrors(), loadProductConfig()]));
    $("#logoutBtn").addEventListener("click", () => {
      token = "";
      localStorage.removeItem("album_admin_token");
      $("#mainBox").style.display = "none";
      $("#loginBox").style.display = "block";
    });
    $("#rows").addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-action]");
      if (!btn) return;
      const action = btn.getAttribute("data-action");
      const accountId = btn.getAttribute("data-account");
      const username = btn.getAttribute("data-user") || "";
      const machineId = btn.getAttribute("data-machine") || "";
      if (action === "license") issueLicense(Number(accountId), username);
      else if (action === "revoke") revoke(Number(accountId));
      else if (action === "unbind") unbind(Number(accountId), machineId);
    });

    function escapeHtml(v) {
      return String(v == null ? "" : v).replace(/[&<>"']/g, c => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
      ));
    }
    function escapeAttr(v) { return escapeHtml(v).replace(/"/g, "&quot;"); }

    (async () => {
      if (!token) return;
      try {
        const data = await api("/api/me");
        if (data.account.role === "admin") enterAdmin(data.account);
        else { token = ""; localStorage.removeItem("album_admin_token"); }
      } catch (e) { token = ""; localStorage.removeItem("album_admin_token"); }
    })();
  </script>
</body>
</html>
