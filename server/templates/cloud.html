<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工程影像云预览</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #0f1720; color: #e8f0f7;
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    }
    .topbar {
      display: flex; align-items: center; gap: 12px; padding: 14px 22px;
      background: #151f2b; border-bottom: 1px solid #22303f;
    }
    .brand { font-size: 18px; font-weight: 700; color: #fff; }
    .brand small { color: #7d93a8; font-weight: 400; margin-left: 8px; }
    .spacer { flex: 1; }
    .btn {
      padding: 8px 16px; border: 0; border-radius: 6px; cursor: pointer;
      background: #1f8bd6; color: #fff; font: inherit; font-weight: 700;
      transition: transform 140ms cubic-bezier(.23,1,.32,1), background-color 160ms ease;
    }
    .btn:active { transform: scale(.97); }
    .btn.ghost { background: #243340; color: #dce7f0; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 20px; }
    .card {
      background: #172230; border: 1px solid #22303f; border-radius: 10px;
      padding: 20px; margin-bottom: 16px;
    }
    input {
      padding: 9px 12px; border: 1px solid #2c3c4d; border-radius: 6px;
      background: #101a26; color: #e8f0f7; font: inherit; width: 100%; margin-bottom: 10px;
    }
    .notice { padding: 10px 12px; border-radius: 6px; margin: 10px 0; display: none; }
    .notice.show { display: block; }
    .notice.err { background: #3a1a18; color: #ffb4ad; border: 1px solid #5c2a26; }
    .notice.ok { background: #123a2a; color: #a5f0c9; border: 1px solid #1f5c44; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
    .tile {
      background: #172230; border: 1px solid #22303f; border-radius: 8px;
      padding: 10px; cursor: pointer; transition: border-color .15s;
    }
    @media (hover:hover) and (pointer:fine) { .tile:hover { border-color: #2f8fdb; } }
    .tile img { width: 100%; height: 150px; object-fit: cover; border-radius: 5px; background: #101a26; }
    .tile .name { margin-top: 8px; font-size: 12px; color: #aabccd; line-height: 1.4; word-break: break-all; }
    .tile .code { font-size: 11px; color: #6f8599; font-family: Consolas, monospace; }
    .tile .count { font-size: 11px; color: #7d93a8; margin-top: 2px; }
    .back { display: inline-block; color: #7fc3ef; cursor: pointer; margin-bottom: 12px; }
    .thumb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
    .thumb-grid img { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; background: #101a26; }
    .muted { color: #7d93a8; font-size: 13px; }
    #loginBox { max-width: 380px; margin: 70px auto; }
    .link { color: #7fc3ef; cursor: pointer; font-size: 13px; }
    .price-line { color: #ffd479; font-size: 13px; }
    @media (prefers-reduced-motion:reduce) { .btn { transition:background-color 120ms ease; } .btn:active { transform:none; } }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">工程影像云预览<small>缩略图 + 编号（仅远程查看）</small></div>
    <div class="spacer"></div>
    <button class="btn ghost" id="logoutBtn" style="display:none">退出登录</button>
  </div>

  <!-- 登录 / 注册 -->
  <div id="loginBox" class="card">
    <h2 style="margin-top:0">云预览登录</h2>
    <p class="muted">在外面（公网）登录后可查看自己项目的可辨认缩略图和编号。<br>平台只同步缩略图，不上传工程原图；完整编辑请回到局域网内使用。</p>
    <input id="user" placeholder="账号（手机号 / QQ / 邮箱）" autocomplete="username">
    <input id="pass" type="password" placeholder="密码" autocomplete="current-password">
    <button class="btn" id="loginBtn" style="width:100%">登录</button>
    <div class="notice" id="loginNotice"></div>
    <p class="muted" style="margin-top:14px">没有账号？<span class="link" id="showReg">注册一个</span>　<span class="link" id="showForgot">忘记密码？</span></p>

    <div id="regBox" style="display:none; margin-top:8px">
      <hr style="border:none;border-top:1px solid #22303f;margin:14px 0">
      <input id="regUser" placeholder="账号（手机号 / QQ / 邮箱）">
      <input id="regPass" type="password" placeholder="登录密码（至少 8 位，包含字母和数字）">
      <input id="regEmail" placeholder="邮箱（选填，用于找回密码）">
      <input id="regInvite" placeholder="邀请码（选填，填了双方有奖励）">
      <label class="muted" style="display:flex;gap:8px;align-items:flex-start;margin:8px 0 12px;line-height:1.5;"><input id="regDeleteAck" type="checkbox" style="width:auto;margin:3px 0 0;">我已了解：登录密码不等于工程删除密码，首次进入桌面软件时需要单独设置并保存工程删除密码。</label>
      <button class="btn" id="regBtn" style="width:100%">注册</button>
      <p class="muted" style="font-size:12px">好友注册并首次登录软件后才算有效邀请，同一设备重复注册不计入。</p>
    </div>

    <div id="forgotBox" style="display:none; margin-top:8px">
      <hr style="border:none;border-top:1px solid #22303f;margin:14px 0">
      <input id="forgotUser" placeholder="账号">
      <div style="display:flex;gap:8px">
        <input id="forgotCode" placeholder="邮箱验证码" style="flex:1">
        <button class="btn" id="forgotSendBtn" style="flex:0 0 auto">发送验证码</button>
      </div>
      <input id="forgotPass" type="password" placeholder="新密码（至少 8 位，包含字母和数字）">
      <button class="btn" id="forgotResetBtn" style="width:100%">重置密码</button>
    </div>
  </div>

  <!-- 项目列表 -->
  <div id="projectsBox" class="wrap" style="display:none">
    <div class="card">
      <div id="whoami" class="muted"></div>
      <div class="price-line" id="priceLine">月度会员 39 元 / 终身会员 399 元（原价）；云端仅提供可辨认缩略图，不上传原图。</div>
    </div>
    <div class="grid" id="projectGrid"></div>
  </div>

  <!-- 项目缩略图详情 -->
  <div id="detailBox" class="wrap" style="display:none">
    <span class="back" id="backBtn">← 返回项目列表</span>
    <div class="card">
      <div id="detailTitle" style="font-weight:700;margin-bottom:4px"></div>
      <div class="muted" id="detailMeta"></div>
      <p class="muted" style="margin-bottom:0">以下为可辨认缩略图预览（非原图）。查看和编辑原图请在局域网内使用桌面版。</p>
    </div>
    <div class="thumb-grid" id="thumbGrid"></div>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    let token = localStorage.getItem("album_cloud_token") || "";
    let username = localStorage.getItem("album_cloud_user") || "";

    function reportError(message, context = {}, stack = "", severity = "error") {
      fetch("/api/client-errors", {
        method: "POST",
        headers: { "Content-Type": "application/json", ...(token ? { "Authorization": "Bearer " + token } : {}) },
        body: JSON.stringify({ source: "cloud_preview_web", message, context, stack, severity, app_version: "web" }),
        keepalive: true
      }).catch(() => {});
    }
    window.addEventListener("error", (event) => reportError(event.message, {
      filename: String(event.filename || "").split(/[\\/]/).pop(), line: event.lineno, column: event.colno
    }, event.error?.stack || ""));
    window.addEventListener("unhandledrejection", (event) => reportError(event.reason?.message || String(event.reason || "未处理的异步错误"), { kind: "unhandledrejection" }, event.reason?.stack || ""));

    function notice(el, msg, ok) {
      el.textContent = msg;
      el.className = "notice show " + (ok ? "ok" : "err");
    }

    async function api(url, opts = {}) {
      const headers = { "Content-Type": "application/json" };
      if (token) headers["Authorization"] = "Bearer " + token;
      let resp;
      try { resp = await fetch(url, { ...opts, headers }); }
      catch (error) {
        reportError(error.message || "网络请求失败", { url, method: opts.method || "GET" }, error.stack || "", "warning");
        return { ok: false, error: "网络连接失败，请稍后重试" };
      }
      let data;
      try { data = await resp.json(); } catch (e) { data = { ok: false, error: "服务器响应异常" }; }
      if (!resp.ok || data.ok === false) reportError(data.error || `HTTP ${resp.status}`, { url, method: opts.method || "GET", status: resp.status }, "", resp.status >= 500 ? "error" : "warning");
      return data;
    }

    async function loadProduct() {
      const data = await api("/api/product-config");
      if (!data.ok) return;
      const pricing = data.product?.pricing || {};
      $("#priceLine").textContent = `月度会员 ${pricing.monthly_price || 39} 元 / 终身会员 ${pricing.lifetime_price || 399} 元（${pricing.price_label || "原价"}）；云端仅提供可辨认缩略图，不上传原图。`;
    }

    async function checkAuth() {
      if (!token) return false;
      const data = await api("/api/me");
      if (data.ok) { showProjects(); return true; }
      return false;
    }

    $("#loginBtn").addEventListener("click", async () => {
      const data = await api("/api/login", {
        method: "POST",
        body: JSON.stringify({ username: $("#user").value.trim(), password: $("#pass").value }),
      });
      if (!data.ok) { notice($("#loginNotice"), data.error || "登录失败", false); return; }
      token = data.token; username = (data.account && data.account.username) || $("#user").value.trim();
      localStorage.setItem("album_cloud_token", token);
      localStorage.setItem("album_cloud_user", username);
      $("#user").value = ""; $("#pass").value = "";
      showProjects();
    });

    $("#showReg").addEventListener("click", () => {
      $("#regBox").style.display = $("#regBox").style.display === "none" ? "block" : "none";
    });

    $("#regBtn").addEventListener("click", async () => {
      const payload = {
        username: $("#regUser").value.trim(),
        password: $("#regPass").value,
      };
      const email = $("#regEmail").value.trim();
      const invite = $("#regInvite").value.trim();
      if (email) payload.email = email;
      if (invite) payload.invite_code = invite;
      if (payload.password.length < 8 || !/[A-Za-z]/.test(payload.password) || !/\d/.test(payload.password)) {
        notice($("#loginNotice"), "登录密码至少 8 位，并同时包含字母和数字", false); return;
      }
      if (!$("#regDeleteAck").checked) { notice($("#loginNotice"), "请先确认已了解工程删除密码的用途", false); return; }
      const data = await api("/api/register", { method: "POST", body: JSON.stringify(payload) });
      notice($("#loginNotice"), data.ok ? "注册成功。首次进入桌面软件时请立即设置并保存工程删除密码。" : (data.error || "注册失败"), !!data.ok);
      if (data.ok) { $("#regBox").style.display = "none"; $("#user").value = payload.username; }
    });

    // 忘记密码
    $("#showForgot").addEventListener("click", () => {
      $("#forgotBox").style.display = $("#forgotBox").style.display === "none" ? "block" : "none";
    });
    $("#forgotSendBtn").addEventListener("click", async () => {
      const account = $("#forgotUser").value.trim();
      if (!account) { notice($("#loginNotice"), "请输入账号", false); return; }
      const data = await api("/api/forgot-password", { method: "POST", body: JSON.stringify({ account }) });
      notice($("#loginNotice"), data.ok ? `验证码已发送到 ${data.email}` : (data.error || "发送失败"), !!data.ok);
    });
    $("#forgotResetBtn").addEventListener("click", async () => {
      const data = await api("/api/reset-password", { method: "POST", body: JSON.stringify({
        account: $("#forgotUser").value.trim(),
        code: $("#forgotCode").value.trim(),
        new_password: $("#forgotPass").value,
      }) });
      notice($("#loginNotice"), data.ok ? "密码已重置，请用新密码登录" : (data.error || "重置失败"), !!data.ok);
      if (data.ok) {
        $("#forgotBox").style.display = "none";
        $("#user").value = $("#forgotUser").value.trim();
        $("#forgotCode").value = ""; $("#forgotPass").value = "";
      }
    });

    $("#logoutBtn").addEventListener("click", () => {
      token = ""; localStorage.removeItem("album_cloud_token"); localStorage.removeItem("album_cloud_user");
      location.reload();
    });

    async function showProjects() {
      $("#loginBox").style.display = "none";
      $("#projectsBox").style.display = "block";
      $("#logoutBtn").style.display = "inline-block";
      $("#whoami").textContent = "当前账号：" + username;
      const data = await api("/api/cloud/projects");
      const grid = $("#projectGrid");
      grid.innerHTML = "";
      if (!data.ok) { notice(grid, data.error || "加载失败", false); return; }
      const list = data.projects || [];
      if (!list.length) {
        grid.innerHTML = '<div class="card muted">暂无项目数据。请在局域网内的软件上打开一次，自动同步后这里就能看到。</div>';
        return;
      }
      list.forEach((p) => {
        const tile = document.createElement("div");
        tile.className = "tile";
        const count = p.thumb_count ? p.thumb_count + " 张" : "暂无";
        tile.innerHTML =
          '<div class="code">' + esc(p.project_code) + '</div>' +
          '<div class="name">' + esc(p.project_name || "") + '</div>' +
          '<div class="count">' + count + '</div>';
        tile.addEventListener("click", () => openDetail(p));
        grid.appendChild(tile);
      });
    }

    async function openDetail(proj) {
      $("#projectsBox").style.display = "none";
      $("#detailBox").style.display = "block";
      $("#detailTitle").textContent = (proj.project_name || "") + "  " + (proj.project_code || "");
      $("#detailMeta").textContent = "编号：" + (proj.project_code || "");
      const data = await api("/api/cloud/thumbs?project_id=" + proj.id);
      const grid = $("#thumbGrid");
      grid.innerHTML = "";
      if (!data.ok) { grid.innerHTML = '<div class="card muted">加载失败</div>'; return; }
      const thumbs = data.thumbs || [];
      if (!thumbs.length) { grid.innerHTML = '<div class="card muted">暂无缩略图</div>'; return; }
      thumbs.forEach((t) => {
        const div = document.createElement("div");
        div.innerHTML = '<img src="data:image/webp;base64,' + t.thumb_b64 + '" alt="' + esc(t.photo_name) + '">' +
          '<div class="muted" style="font-size:11px;word-break:break-all">' + esc(t.photo_name) + '</div>';
        grid.appendChild(div);
      });
    }

    $("#backBtn").addEventListener("click", () => {
      $("#detailBox").style.display = "none";
      $("#projectsBox").style.display = "block";
    });

    function esc(s) {
      return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    loadProduct();
    checkAuth();
  </script>
</body>
</html>
