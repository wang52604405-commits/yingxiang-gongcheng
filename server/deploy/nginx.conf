# 公网 IP HTTPS 独立站点模板；已备案域名 api.shuiliyingxiang.cn 使用 nginx-domain.conf。
# enable-https-ip.sh 只新增此 443 站点，不覆盖原 album-auth HTTP 配置，
# 因而原有 HTTP API、/memory、/update 等兼容路径都会保留。
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __PUBLIC_IP__;

    ssl_certificate /etc/letsencrypt/live/__PUBLIC_IP__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__PUBLIC_IP__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ALBUM_AUTH_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=86400" always;

    client_max_body_size 52m;
    client_body_timeout 240s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 240s;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }
}
