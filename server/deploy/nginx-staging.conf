# 可选的 staging HTTPS 模板；域名、证书、上游和正式环境完全分离。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging-api.shuiliyingxiang.cn;

    ssl_certificate /etc/letsencrypt/live/staging-api.shuiliyingxiang.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-api.shuiliyingxiang.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 52m;
    client_body_timeout 240s;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 240s;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }
}
