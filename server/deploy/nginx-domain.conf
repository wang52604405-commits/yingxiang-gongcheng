# 已备案正式域名 HTTPS 站点。微信 request/uploadFile/downloadFile 使用该域名。
# 80 端口仍由兼容站点处理，避免旧桌面客户端在升级前失联。
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.shuiliyingxiang.cn;

    ssl_certificate /etc/letsencrypt/live/api.shuiliyingxiang.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.shuiliyingxiang.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ALBUM_AUTH_DOMAIN_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 52m;
    client_body_timeout 240s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=86400" always;

    location = /update/update-guide.html {
        alias /var/www/updates/update-guide.html;
        default_type text/html;
        charset utf-8;
    }

    location /update/ {
        alias /var/www/updates/;
        default_type application/octet-stream;
    }

    location /memory/ {
        proxy_pass http://127.0.0.1:5199/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20m;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 240s;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }
}
