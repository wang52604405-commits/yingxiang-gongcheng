<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>专业工程影像采集清单</title>
<style>
:root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#1b292d;background:#f4f7f8}*{box-sizing:border-box}body{margin:0}.top{position:sticky;top:0;z-index:2;background:#0f444d;color:#fff;padding:18px 28px;box-shadow:0 4px 18px #0002}.top h1{margin:0;font-size:22px}.top p{margin:6px 0 0;opacity:.78}.wrap{max-width:1500px;margin:22px auto;padding:0 22px}.toolbar,.summary{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.card{background:#fff;border:1px solid #dbe4e6;border-radius:14px;padding:16px}.stat{min-width:120px}.stat b{font-size:26px;display:block}.stat span{color:#718187;font-size:13px}.toolbar input,.toolbar select{height:40px;border:1px solid #cad7da;border-radius:9px;padding:0 12px;background:#fff}.toolbar input{min-width:320px;flex:1}.btn{height:40px;border:0;border-radius:9px;padding:0 16px;cursor:pointer;background:#197f79;color:#fff}.btn.secondary{background:#e8f5f3;color:#12645f}.table-wrap{overflow:auto;background:#fff;border:1px solid #dbe4e6;border-radius:14px}table{border-collapse:collapse;width:100%;min-width:1350px}th,td{padding:11px 10px;border-bottom:1px solid #edf1f2;text-align:left;vertical-align:top;font-size:13px;line-height:1.5}th{position:sticky;top:0;background:#f7fafb;color:#496067}.tag{display:inline-block;padding:3px 8px;border-radius:999px;font-weight:700}.required{background:#ffe7e7;color:#b42318}.conditional{background:#fff0d8;color:#9a5a00}.recommended{background:#e7f7f3;color:#16665f}.empty{text-align:center;color:#829196;padding:60px}.note{color:#6f8085;font-size:12px;margin:12px 2px}@media print{.top,.toolbar,.note{display:none}.wrap{max-width:none;margin:0;padding:0}.table-wrap{border:0}th{position:static}.card{break-inside:avoid}}
</style>
</head>
<body>
<div class="top"><h1>专业工程影像采集清单</h1><p id="subtitle">读取中…</p></div>
<div class="wrap">
  <div class="summary" id="summary"></div>
  <div class="toolbar card"><select id="typeFilter"><option value="">全部级别</option><option value="required">必拍</option><option value="conditional">条件必拍</option><option value="recommended">推荐</option></select><input id="keyword" placeholder="搜索阶段、分部、分项、工序、照片要求"><button class="btn secondary" onclick="window.print()">打印清单</button><button class="btn" id="csvBtn">导出CSV</button></div>
  <div class="table-wrap"><table><thead><tr><th>级别</th><th>编码</th><th>阶段</th><th>分部/系统</th><th>子分部</th><th>分项</th><th>工序</th><th>照片要求</th><th>最少张数</th><th>拍摄角度</th><th>拍摄时机</th><th>隐蔽前</th><th>GPS</th><th>说明模板</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden>当前筛选条件下没有内容</div></div>
  <p class="note">“必拍/条件必拍/推荐”为软件默认工程留痕规则，可继续被地区、业主或项目自定义模板覆盖；不得替代项目合同、当地城建档案馆或业主的正式归档要求。</p>
</div>
<script>
const qs=new URLSearchParams(location.search);const industry=qs.get('industry')||'水利工程';const projectType=qs.get('project_type')||'';let data=[];
const labels={required:'必拍',conditional:'条件必拍',recommended:'推荐'};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const r=await fetch(`/api/professional-templates/requirements?industry=${encodeURIComponent(industry)}&project_type=${encodeURIComponent(projectType)}`);if(!r.ok)throw new Error(`HTTP ${r.status}`);const j=await r.json();data=Array.isArray(j.requirements)?j.requirements:[];document.querySelector('#subtitle').textContent=`${industry} · ${projectType||'通用模板'} · ${j.summary?.template_version||'V1.0'}`;const s=j.summary||{};document.querySelector('#summary').innerHTML=[['全部',s.total||0],['必拍',s.required||0],['条件必拍',s.conditional||0],['推荐',s.recommended||0]].map(x=>`<div class="card stat"><b>${Number(x[1])||0}</b><span>${x[0]}</span></div>`).join('');render()}
function render(){const type=document.querySelector('#typeFilter').value,q=document.querySelector('#keyword').value.trim().toLowerCase();const arr=data.filter(x=>(!type||x.required_type===type)&&(!q||Object.values(x).join(' ').toLowerCase().includes(q)));document.querySelector('#rows').innerHTML=arr.map(x=>`<tr><td><span class="tag ${esc(x.required_type)}">${labels[x.required_type]||esc(x.required_type)}</span></td><td>${esc(x.template_code)}</td><td>${esc(x.phase)}</td><td>${esc(x.division)}</td><td>${esc(x.subdivision)}</td><td>${esc(x.item)}</td><td>${esc(x.process)}</td><td><b>${esc(x.photo_requirement_name)}</b></td><td>${Number(x.min_photo_count||0)}</td><td>${esc(x.shot_types)}</td><td>${esc(x.timing)}</td><td>${esc(x.before_concealment_required)}</td><td>${esc(x.gps_required)}</td><td>${esc(x.description_template)}</td></tr>`).join('');document.querySelector('#empty').hidden=arr.length>0}
function csv(){const cols=['required_type','template_code','phase','division','subdivision','item','process','photo_requirement_name','min_photo_count','shot_types','timing','before_concealment_required','gps_required','description_template'];const quote=v=>'"'+String(v??'').replaceAll('"','""')+'"';const text='\ufeff'+cols.map(quote).join(',')+'\n'+data.map(x=>cols.map(k=>quote(x[k])).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=`${industry}-${projectType||'通用'}-影像采集清单.csv`;a.click();URL.revokeObjectURL(a.href)}
document.querySelector('#typeFilter').onchange=render;document.querySelector('#keyword').oninput=render;document.querySelector('#csvBtn').onclick=csv;load().catch(error=>{document.querySelector('#subtitle').textContent='加载失败：'+error.message})
</script>
</body></html>
