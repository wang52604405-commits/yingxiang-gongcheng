<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>待分类影像 · 工程影像</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172b36;font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif}button,input,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:1px solid #ccd6dc;border-radius:8px;background:#fff;min-height:42px;padding:8px 16px}button:active{transform:scale(.98)}button:disabled{opacity:.5;cursor:default}a{color:#116964;text-decoration:none}header{padding:22px max(24px,calc((100vw - 1180px)/2));background:#fff;border-bottom:1px solid #dde4e8;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:24px;margin:0}main{max-width:1228px;margin:24px auto;padding:0 24px}.subtitle{color:#60747f;margin:8px 0 20px}.controls{display:grid;grid-template-columns:minmax(180px,1fr) minmax(240px,2fr) minmax(180px,1fr) auto;align-items:end;gap:14px;background:white;padding:20px;border:1px solid #dfe6ea;border-radius:12px;position:sticky;top:0;z-index:2}.controls label{display:grid;gap:6px;font-size:13px;color:#566e7a}input[type=search],select{width:100%;min-height:42px;border:1px solid #becdd4;border-radius:7px;padding:8px;background:white;color:#172b36}.primary{background:#136d65;color:white;border-color:#136d65}.list-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:24px 0 14px}.photo-list{display:grid;gap:12px}.photo{display:grid;grid-template-columns:28px 160px minmax(0,1fr);align-items:start;gap:18px;background:white;padding:18px;border:1px solid #dfe6ea;border-radius:10px}.photo.selected{border-color:#167d70;background:#f4fcfa}.photo input{width:20px;height:20px;margin-top:4px}.thumb{width:160px;height:120px;object-fit:contain;background:#edf1f3;border-radius:6px}.photo h2{font-size:17px;margin:0 0 8px;overflow-wrap:anywhere}.meta{color:#637785;font-size:14px;display:flex;flex-wrap:wrap;gap:8px 20px}.reason{margin:10px 0 0;color:#9b6313;font-size:14px}.notice{margin:18px 0;padding:12px 16px;border-radius:8px;background:#fff4df;color:#855100;white-space:pre-wrap}.notice[hidden]{display:none}.empty{padding:70px 20px;text-align:center;color:#71828c;background:white;border:1px dashed #ccd6dc;border-radius:12px}.pager{display:flex;justify-content:center;align-items:center;gap:20px;padding:24px}.status{font-size:14px;color:#637785}input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #64b6af;outline-offset:2px}@media(max-width:850px){.controls{grid-template-columns:1fr 1fr;position:static}.photo{grid-template-columns:24px 104px minmax(0,1fr);gap:10px}.thumb{width:104px;height:95px}header{padding:18px}main{padding:0 16px}}@media(max-width:500px){.controls{grid-template-columns:1fr}.photo{grid-template-columns:24px 80px minmax(0,1fr)}.thumb{width:80px;height:80px}h1{font-size:21px}}
  </style>
</head>
<body>
  <header><h1>待分类影像</h1><a href="/">返回工作台</a></header>
  <main>
    <p id="project" class="subtitle">正在读取当前工程…</p>
    <section class="controls" aria-label="归档位置">
      <label>搜索施工部位<input id="unitSearch" type="search" placeholder="输入单元、分部名称或编号"></label>
      <label>目标单元<select id="unit"><option value="">请选择单元</option></select></label>
      <label>工序（可选）<select id="process"><option value="">不指定工序</option></select></label>
      <button id="classify" class="primary" disabled>移入所选单元</button>
    </section>
    <p class="subtitle">原图已保存在电脑。无法确定单元的照片先放在这里，人工归类后同步云端归档信息。</p>
    <div id="notice" class="notice" role="status" hidden></div>
    <div class="list-head"><label><input id="selectPage" type="checkbox"> 选择本页</label><span id="count" class="status"></span><button id="refresh">刷新</button></div>
    <section id="photos" class="photo-list" aria-label="待分类照片"></section>
    <div class="pager"><button id="previous">上一页</button><span id="pageLabel"></span><button id="next">下一页</button></div>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    let state = {photos:[],units:[],project_id:'',project_name:''}, page = 0, busy = false;
    const selected = new Set();
    const pageSize = 60;
    function notice(message){$('notice').textContent=message;$('notice').hidden=!message}
    async function api(url,options){const response=await fetch(url,{credentials:'same-origin',...options});const value=await response.json();if(!response.ok||!value.ok)throw Error(value.error||'请求失败，请重试');return value}
    function option(value,label){const node=document.createElement('option');node.value=value;node.textContent=label;return node}
    function renderUnits(){const current=$('unit').value,query=$('unitSearch').value.trim().toLowerCase();$('unit').replaceChildren(option('','请选择单元'));state.units.filter(unit=>`${unit.code} ${unit.name} ${unit.path}`.toLowerCase().includes(query)).forEach(unit=>$('unit').append(option(unit.code,`${unit.path||unit.name} · ${unit.code}`)));$('unit').value=current;renderProcesses()}
    function renderProcesses(){const previous=$('process').value,unit=state.units.find(item=>item.code===$('unit').value);$('process').replaceChildren(option('','不指定工序'));(unit?.processes||[]).forEach(name=>$('process').append(option(name,name)));$('process').value=(unit?.processes||[]).includes(previous)?previous:'';updateSelection()}
    function updateSelection(){$('count').textContent=`共 ${state.photos.length} 张 · 已选 ${selected.size} 张`;$('classify').disabled=busy||!selected.size||!$('unit').value;const visible=state.photos.slice(page*pageSize,(page+1)*pageSize);$('selectPage').checked=visible.length>0&&visible.every(photo=>selected.has(photo.photo_uuid));$('selectPage').indeterminate=visible.some(photo=>selected.has(photo.photo_uuid))&&!$('selectPage').checked}
    function render(){const visible=state.photos.slice(page*pageSize,(page+1)*pageSize);$('photos').replaceChildren();if(!visible.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='当前没有待分类影像';$('photos').append(empty)}visible.forEach(photo=>{const row=document.createElement('article');row.className='photo'+(selected.has(photo.photo_uuid)?' selected':'');const check=document.createElement('input');check.type='checkbox';check.checked=selected.has(photo.photo_uuid);check.ariaLabel=`选择 ${photo.title||'照片'}`;check.disabled=busy;check.onchange=()=>{if(check.checked)selected.add(photo.photo_uuid);else selected.delete(photo.photo_uuid);row.classList.toggle('selected',check.checked);updateSelection()};const link=document.createElement('a');link.href=photo.url;link.target='_blank';link.rel='noopener';const image=document.createElement('img');image.className='thumb';image.loading='lazy';image.alt=photo.title||'待分类照片';image.src=photo.thumb_url||photo.url;link.append(image);const copy=document.createElement('div');const title=document.createElement('h2');title.textContent=photo.title||'未填写题名';const meta=document.createElement('div');meta.className='meta';[photo.photo_date||'日期未填写',photo.photographer||'拍摄者未填写',photo.category_label||'施工'].forEach(value=>{const item=document.createElement('span');item.textContent=value;meta.append(item)});const reason=document.createElement('p');reason.className='reason';reason.textContent=photo.review_reason||'未确定施工单元，请人工选择';const site=document.createElement('p');site.className='status';site.textContent=photo.site_part?`施工部位：${photo.site_part}`:'';copy.append(title,meta,reason,site);row.append(check,link,copy);$('photos').append(row)});$('pageLabel').textContent=`${page+1} / ${Math.max(1,Math.ceil(state.photos.length/pageSize))}`;$('previous').disabled=busy||page===0;$('next').disabled=busy||(page+1)*pageSize>=state.photos.length;updateSelection()}
    async function load(){try{const previousProject=state.project_id;state=await api('/api/unclassified');if(previousProject&&previousProject!==state.project_id)selected.clear();const ids=new Set(state.photos.map(photo=>photo.photo_uuid));for(const id of selected)if(!ids.has(id))selected.delete(id);page=Math.min(page,Math.max(0,Math.ceil(state.photos.length/pageSize)-1));$('project').textContent=state.project_name;renderUnits();render()}catch(error){notice(error.message)}}
    $('unitSearch').oninput=renderUnits;$('unit').onchange=renderProcesses;$('refresh').onclick=()=>{notice('');load()};$('previous').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('selectPage').onchange=()=>{state.photos.slice(page*pageSize,(page+1)*pageSize).forEach(photo=>$('selectPage').checked?selected.add(photo.photo_uuid):selected.delete(photo.photo_uuid));render()};
    $('classify').onclick=async()=>{if(busy||!selected.size)return;if(selected.size>100){notice('一次最多归类 100 张，请减少选择');return}busy=true;render();$('refresh').disabled=true;try{const result=await api('/api/unclassified/classify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project_id:state.project_id,photo_uuids:[...selected],target_project_code:$('unit').value,target_process_name:$('process').value})});selected.clear();notice(`已将 ${result.count} 张照片移入所选单元，云端归档信息稍后同步。`);await load()}catch(error){notice(error.message);await load()}finally{busy=false;$('refresh').disabled=false;render()}};
    load();
  </script>
</body>
</html>
