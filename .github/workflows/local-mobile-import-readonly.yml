name: 016单元照片消失只读追查
on:
  push:
    branches: [chatgpt/wechat-local-import-check-20260915]
    paths: [.github/workflows/local-mobile-import-readonly.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Inspect unit files and backups without modifying data
        shell: python
        run: |
          import json,hashlib,os
          from pathlib import Path
          root=Path('D:/工程影像资料/albums')
          code='YNLQ-2024-SG-1-02-016'
          d=root/code
          meta=d/'metadata.json'
          def stamp(p):
              try:
                  s=p.stat(); return {'size':s.st_size,'mtime_ns':s.st_mtime_ns,'mtime':__import__('datetime').datetime.fromtimestamp(s.st_mtime).isoformat(timespec='seconds')}
              except Exception: return None
          print('META='+json.dumps({'path':str(meta),'stat':stamp(meta)},ensure_ascii=True))
          photos=d/'photos'
          files=[]
          if photos.is_dir():
              for p in sorted(photos.iterdir(),key=lambda x:x.stat().st_mtime if x.exists() else 0):
                  if p.is_file(): files.append({'name':p.name,'stat':stamp(p),'sha12':hashlib.sha256(p.read_bytes()).hexdigest()[:12]})
          print('FILES='+json.dumps(files,ensure_ascii=True))
          backups=[]
          for base in [d/'_mobile_sync_backups',d/'backups',d/'_backup',root/'mobile-sync-backups']:
              if not base.exists(): continue
              for p in sorted(base.rglob('*.json')):
                  try:
                      doc=json.loads(p.read_text(encoding='utf-8-sig'))
                  except Exception: continue
                  if str(doc.get('project_code') or doc.get('display_project_code') or '') not in {code,''} and code not in p.name: continue
                  ph=doc.get('photos') or []
                  backups.append({'path':str(p),'stat':stamp(p),'photo_count':len(ph),'uuids':[hashlib.sha256(str(x.get('photo_uuid') or '').encode()).hexdigest()[:12] for x in ph if isinstance(x,dict) and x.get('photo_uuid')][:20],'names':[x.get('filename') for x in ph if isinstance(x,dict)][:20]})
          print('BACKUPS='+json.dumps(backups,ensure_ascii=True))
          # also report temp/renumber leftovers in the unit
          leftovers=[]
          for p in d.rglob('*'):
              if p.is_file() and p.name!='metadata.json' and p.parent!=photos and 'backup' not in str(p.parent).lower():
                  leftovers.append({'path':str(p),'stat':stamp(p)})
          print('LEFTOVERS='+json.dumps(leftovers[:100],ensure_ascii=True))
