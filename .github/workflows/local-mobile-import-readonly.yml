name: 桌面端手机照片落盘只读核对
on:
  push:
    branches: [chatgpt/wechat-local-import-check-20260915]
    paths: [.github/workflows/local-mobile-import-readonly.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Inspect exact local units without modifying data
        shell: python
        run: |
          import json,os
          from pathlib import Path
          root=Path('D:/工程影像资料/albums')
          targets=['YNLQ-2024-SG-1-02-016','YNLQ-2024-SG-1-02-046','MOBILE-WAIT-aa2e8f95f863753f']
          for code in targets:
              p=root/code/'metadata.json'
              if not p.is_file():
                  print('UNIT='+json.dumps({'code':code,'exists':False},ensure_ascii=True)); continue
              doc=json.loads(p.read_text(encoding='utf-8-sig'))
              rows=[]
              for ph in doc.get('photos') or []:
                  title=str(ph.get('title') or '')
                  if code=='YNLQ-2024-SG-1-02-016' or '塌落度' in title or code.startswith('MOBILE-WAIT'):
                      rows.append({
                        'id':ph.get('id'),'title':title,'photo_date':ph.get('photo_date'),
                        'category':ph.get('category'),'process_name':ph.get('process_name'),
                        'filename':ph.get('filename'),'file_exists':bool(ph.get('filename') and (p.parent/'photos'/str(ph.get('filename'))).is_file()),
                        'uploaded_by':ph.get('uploaded_by'),'capture_source':ph.get('capture_source'),
                        'photographer':ph.get('photographer')
                      })
              print('UNIT='+json.dumps({'code':code,'exists':True,'project_name':doc.get('project_name'),'photo_count':len(doc.get('photos') or []),'rows':rows},ensure_ascii=True))
