name: 客服手机照片迁移到新归档电脑
on:
  push:
    branches:
      - chatgpt/migrate-owner40-pending-to-2ed2-20260915
    paths:
      - tools/migrate_owner40_pending_to_machine.py
      - .github/workflows/migrate-owner40-pending.yml
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_KEY_B64: ${{ secrets.ALBUM_SSH_KEY_B64 }}
    steps:
      - uses: actions/checkout@v7
      - name: Migrate pending photos on production server
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SSH_KEY_B64:-}"
          key="$RUNNER_TEMP/server_key"
          printf '%s' "$SSH_KEY_B64" | base64 -d > "$key"
          chmod 600 "$key"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i "$key" root@47.95.221.66 'python3 -' < tools/migrate_owner40_pending_to_machine.py
          rm -f "$key"
