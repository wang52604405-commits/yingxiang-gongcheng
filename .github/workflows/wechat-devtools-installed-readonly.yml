name: 微信开发者工具只读检查
on:
  push:
    branches:
      - chatgpt/wechat-desktop-sync-20260915
    paths:
      - .github/workflows/wechat-devtools-installed-readonly.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 5
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Locate WeChat DevTools CLI without changing login state
        shell: python
        run: |
          import os
          from pathlib import Path
          roots = [
              Path(r'C:\Program Files (x86)\Tencent'),
              Path(r'C:\Program Files\Tencent'),
              Path(os.environ.get('LOCALAPPDATA','')) / '微信开发者工具',
              Path(os.environ.get('LOCALAPPDATA','')) / 'Programs',
          ]
          found=[]
          for root in roots:
              if not root.is_dir():
                  continue
              try:
                  for name in ('cli.bat','cli.exe'):
                      for p in root.rglob(name):
                          if p.is_file(): found.append(str(p))
              except OSError:
                  pass
          found=list(dict.fromkeys(found))
          print('cli_count='+str(len(found)))
          for p in found[:20]: print('cli='+p)
          print('localappdata='+os.environ.get('LOCALAPPDATA',''))
