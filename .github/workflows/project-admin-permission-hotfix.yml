name: 项目管理员权限修复并推送桌面端

on:
  push:
    branches: [main]
    paths:
      - ".diag/project-admin-permission-hotfix-trigger.txt"

permissions:
  contents: write

concurrency:
  group: project-admin-permission-hotfix
  cancel-in-progress: false

jobs:
  patch-and-release:
    name: 修复管理员权限并触发桌面端正式发布
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 修复项目角色到桌面权限映射
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")
          old = '    session["role"] = "project_staff"'
          new = (
              '    access_role = str(member.get("role") or "viewer").strip().lower()\n'
              '    session["role"] = "project_admin" if access_role in {"owner", "admin"} else "project_staff"'
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"permission mapping target count={count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: 静态校验
        shell: bash
        run: |
          python -m compileall -q app.py
          python - <<'PY'
          from pathlib import Path
          text = Path("app.py").read_text(encoding="utf-8")
          assert 'access_role = str(member.get("role") or "viewer").strip().lower()' in text
          assert 'session["role"] = "project_admin" if access_role in {"owner", "admin"} else "project_staff"' in text
          PY
          git diff --check

      - name: 提交修复并触发正式桌面发布
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "app.py already contains the target permission mapping"
            exit 0
          fi
          git commit -m "fix: grant project admins full desktop workspace permissions"
          git push origin HEAD:main
