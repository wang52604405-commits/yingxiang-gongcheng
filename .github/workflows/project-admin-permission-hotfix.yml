name: 项目管理员权限热修复（同版本）

on:
  push:
    branches: [main]
    paths:
      - ".diag/project-admin-permission-hotfix-trigger.txt"

permissions:
  contents: write

concurrency:
  group: project-admin-permission-hotfix
  cancel-in-progress: false

jobs:
  hotfix:
    name: 管理员跨电脑完整操作权限同版本热修复
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 35
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      ALBUM_INSTALL_DIR: C:\Users\Administrator\AppData\Local\工程影像管理平台
      ALBUM_DATA_DIR: D:\工程影像资料
      ALBUM_PORT: "5088"
      ALBUM_CLOUD_AUTO_USER: ${{ secrets.ALBUM_CLOUD_AUTO_USER }}
      ALBUM_CLOUD_AUTO_PASS: ${{ secrets.ALBUM_CLOUD_AUTO_PASS }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 修复项目角色到桌面权限映射
        shell: powershell
        run: |
          python -c "from pathlib import Path; p=Path('app.py'); s=p.read_text(encoding='utf-8'); old='    session[\"role\"] = \"project_staff\"\n'; new='    access_role = str(member.get(\"role\") or \"viewer\").strip().lower()\n    session[\"role\"] = \"project_admin\" if access_role in {\"owner\", \"admin\"} else \"project_staff\"\n'; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1),encoding='utf-8')"
          if ($LASTEXITCODE -ne 0) { throw "permission mapping patch failed" }

      - name: 快速回归验证
        shell: powershell
        run: |
          python -m unittest tests.test_product_core.DesktopSecurityContractTest.test_z_approved_project_staff_can_enter_lan_workspace_without_cloud_password -v
          if ($LASTEXITCODE -ne 0) { throw "restricted staff regression failed" }
          python -c "from pathlib import Path; s=Path('app.py').read_text(encoding='utf-8'); assert 'access_role in {\"owner\", \"admin\"}' in s; assert 'session[\"role\"] = \"project_admin\"' in s"
          if ($LASTEXITCODE -ne 0) { throw "admin permission assertion failed" }
          python -m compileall -q app.py
          if ($LASTEXITCODE -ne 0) { throw "compile failed" }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff check failed" }

      - name: 确认版本号不变
        shell: powershell
        run: |
          $version = python -c "import re,pathlib; s=pathlib.Path('cloud_client.py').read_text(encoding='utf-8-sig'); print(re.search(r'APP_VERSION\s*=\s*\"([^\"]+)\"', s).group(1))"
          Write-Host "same-version hotfix APP_VERSION=$version"

      - name: 准备临时签名密钥
        shell: powershell
        env:
          SIGN_KEY_B64: ${{ secrets.ALBUM_SIGN_KEY_B64 }}
        run: |
          if (-not $env:SIGN_KEY_B64) { throw "missing ALBUM_SIGN_KEY_B64" }
          $credentialDir = Join-Path $env:RUNNER_TEMP "album-admin-hotfix-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $credentialDir -Force | Out-Null
          $signKey = Join-Path $credentialDir "release_guard_private_key.pem"
          [IO.File]::WriteAllBytes($signKey, [Convert]::FromBase64String($env:SIGN_KEY_B64))
          icacls $credentialDir /inheritance:r /grant:r "$($env:USERNAME):(OI)(CI)F" | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "ALBUM_SIGN_KEY=$signKey"
          Add-Content -Path $env:GITHUB_ENV -Value "ALBUM_HOTFIX_CREDENTIAL_DIR=$credentialDir"

      - name: 同版本热部署 5088
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\deploy_prod.ps1

      - name: 保存源代码修复且不触发常规发版
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix: grant project admins full LAN workspace permissions [skip ci]"
            git push origin HEAD:main
          }

      - name: 清理临时签名密钥
        if: always()
        shell: powershell
        run: |
          if ($env:ALBUM_HOTFIX_CREDENTIAL_DIR -and (Test-Path -LiteralPath $env:ALBUM_HOTFIX_CREDENTIAL_DIR)) {
            Remove-Item -LiteralPath $env:ALBUM_HOTFIX_CREDENTIAL_DIR -Recurse -Force
          }
