name: ChatGPT one-time miniapp admin patch

on:
  push:
    branches:
      - chatgpt/miniapp-admin-date-quota-20260910
    paths:
      - .github/workflows/chatgpt-one-time-miniapp-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: chatgpt/miniapp-admin-date-quota-20260910
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply final targeted source patches
        run: python tools/chatgpt_patch_miniapp_admin_quota_20260910.py
      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/mobile_api.py tests/test_mobile_server.py
          git diff --cached --check
          git commit -m "test: verify admin join review and 500-photo fallback"
          git push origin HEAD:chatgpt/miniapp-admin-date-quota-20260910
