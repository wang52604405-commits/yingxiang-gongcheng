name: 微信开发者工具发布分支

on:
  push:
    branches: [main]
    paths:
      - "miniprogram/**"
      - ".github/workflows/wechat-devtools-release.yml"
  workflow_dispatch:
    inputs:
      source_sha:
        description: 需要编译为微信包的源提交
        required: false
        type: string
      source_ref:
        description: 源分支，仅写入发布包追溯信息
        required: false
        default: main
        type: string

permissions:
  contents: write

concurrency:
  group: wechat-devtools-release
  cancel-in-progress: true

jobs:
  publish:
    name: 编译并更新 codex/wechat-mp-release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 拉取源代码
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: 安装 Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json

      - name: 安装锁定依赖
        working-directory: miniprogram
        run: npm ci

      - name: 类型检查与小程序回归
        working-directory: miniprogram
        run: |
          npm run typecheck
          npm test

      - name: 检查微信 AppID 配置
        id: appid
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID || 'wx8ad581f01bf4b09f' }}
        run: |
          if [ -n "${WECHAT_APP_ID}" ]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: 缺少 AppID 时保留源代码 CI 绿色
        if: steps.appid.outputs.configured != 'true'
        run: echo "未配置仓库 Secret WECHAT_APP_ID，暂不更新微信发布分支；源代码仍可正常测试。"

      - name: 编译正式微信包
        if: steps.appid.outputs.configured == 'true'
        working-directory: miniprogram
        env:
          VITE_WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID || 'wx8ad581f01bf4b09f' }}
        run: npm run build:mp-weixin:release

      - name: 发布编译产物分支
        if: steps.appid.outputs.configured == 'true'
        env:
          SOURCE_COMMIT: ${{ inputs.source_sha || github.sha }}
          SOURCE_REF: ${{ inputs.source_ref || github.ref_name }}
        run: |
          set -euo pipefail
          release_dir="$(mktemp -d)"
          if git ls-remote --exit-code --heads origin codex/wechat-mp-release >/dev/null 2>&1; then
            git fetch --depth=1 origin codex/wechat-mp-release
            git worktree add --force -B codex/wechat-mp-release "${release_dir}" FETCH_HEAD
            git -C "${release_dir}" rm -r --ignore-unmatch .
          else
            git worktree add --detach "${release_dir}" HEAD
            git -C "${release_dir}" checkout --orphan codex/wechat-mp-release
            git -C "${release_dir}" rm -r --ignore-unmatch .
          fi
          cp -a miniprogram/dist/build/mp-weixin/. "${release_dir}/"
          printf 'source_commit=%s\nsource_ref=%s\n' "${SOURCE_COMMIT}" "${SOURCE_REF}" > "${release_dir}/SOURCE_COMMIT.txt"
          git -C "${release_dir}" config user.name "github-actions[bot]"
          git -C "${release_dir}" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "${release_dir}" add --all
          if git -C "${release_dir}" diff --cached --quiet; then
            echo "Release package already matches; continue to upload."
          else
            git -C "${release_dir}" commit -m "build: 微信开发者工具包 ${SOURCE_COMMIT:0:7}"
            git -C "${release_dir}" push origin HEAD:codex/wechat-mp-release
          fi
