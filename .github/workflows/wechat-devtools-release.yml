name: 微信开发者工具发布分支

on:
  workflow_dispatch:
  push:
    branches:
      - codex/wechat-miniapp-v1
      - main

permissions:
  contents: write

concurrency:
  group: wechat-devtools-release
  cancel-in-progress: true

jobs:
  publish:
    name: 编译并更新 codex/wechat-mp-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 拉取源代码
        uses: actions/checkout@v4

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json

      - name: 安装锁定依赖
        working-directory: miniprogram
        run: npm ci

      - name: 检查微信 AppID 配置
        id: appid
        env:
          WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID || 'wx8ad581f01bf4b09f' }}
        run: |
          if [ -n "${WECHAT_APP_ID}" ]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: 缺少 AppID 时保留源代码 CI 绿色
        if: steps.appid.outputs.configured != 'true'
        run: echo "未配置仓库 Secret WECHAT_APP_ID，暂不更新微信发布分支；源代码仍可正常测试。"

      - name: 编译正式微信包
        if: steps.appid.outputs.configured == 'true'
        working-directory: miniprogram
        env:
          VITE_WECHAT_APP_ID: ${{ secrets.WECHAT_APP_ID || 'wx8ad581f01bf4b09f' }}
        run: npm run build:mp-weixin:release

      - name: 发布编译产物分支
        if: steps.appid.outputs.configured == 'true'
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_dir="$(mktemp -d)"
          cp -a miniprogram/dist/build/mp-weixin/. "${release_dir}/"
          printf 'source_commit=%s\nsource_ref=%s\n' "${SOURCE_COMMIT}" "${SOURCE_REF}" > "${release_dir}/SOURCE_COMMIT.txt"
          cd "${release_dir}"
          git init
          git checkout --orphan codex/wechat-mp-release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "build: 微信开发者工具包 ${SOURCE_COMMIT:0:7}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:codex/wechat-mp-release
