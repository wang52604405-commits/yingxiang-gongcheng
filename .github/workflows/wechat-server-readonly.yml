name: 云端手机照片只读追查
on:
  push:
    branches:
      - chatgpt/wechat-desktop-sync-20260915
    paths:
      - .github/workflows/wechat-server-readonly.yml
permissions:
  contents: read
jobs:
  read:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 5
    env:
      SSH_KEY_B64: ${{ secrets.ALBUM_SSH_KEY_B64 }}
    steps:
      - name: Read imported mobile photo history only
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SSH_KEY_B64) { throw 'missing ssh diagnostic credential' }
          $dir = Join-Path $env:RUNNER_TEMP ('wechat-history-' + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $key = Join-Path $dir 'server_key'
          [IO.File]::WriteAllBytes($key,[Convert]::FromBase64String($env:SSH_KEY_B64))
          icacls $dir /inheritance:r /grant:r "$($env:USERNAME):(OI)(CI)F" | Out-Null
          $py = @'
import os,sqlite3,subprocess,hashlib,json
from pathlib import Path
pid=subprocess.check_output(['systemctl','show','--property=MainPID','--value','album-auth'],text=True).strip()
env={}
for item in Path(f'/proc/{pid}/environ').read_bytes().split(b'\0'):
    k,sep,v=item.partition(b'=')
    if sep: env[k.decode('utf-8','surrogateescape')]=v.decode('utf-8','surrogateescape')
cwd=Path(os.readlink(f'/proc/{pid}/cwd'))
db=Path(env.get('ALBUM_SERVER_DB') or (Path(env['ALBUM_SERVER_DATA'])/'server.db' if env.get('ALBUM_SERVER_DATA') else cwd/'data'/'server.db'))
if not db.is_absolute(): db=cwd/db
db=db.resolve()
con=sqlite3.connect(f'file:{db}?mode=ro',uri=True); con.row_factory=sqlite3.Row
h=lambda v: hashlib.sha256(str(v or '').encode()).hexdigest()[:12] if v else ''
ids=(1290,1291,1292,1293,1320,1321)
q='SELECT id,batch_id,photo_uuid,status,local_project_code,local_photo_id,created_at,updated_at,desktop_imported_at,deleted_at,deleted_by_machine_id,deleted_by_account_id,error_code,error_message,target_machine_id FROM cloud_photos WHERE id IN (%s) ORDER BY id' % ','.join('?'*len(ids))
photos=[]
for r in con.execute(q,ids).fetchall():
    d=dict(r); d['photo_uuid_hash']=h(d.pop('photo_uuid')); d['target_machine_id']=h(d.get('target_machine_id')); d['deleted_by_machine_id']=h(d.get('deleted_by_machine_id')); photos.append(d)
print('tracked_photos='+json.dumps(photos,ensure_ascii=True))
# Print photo change history for these UUIDs without exposing UUIDs/payload wholesale.
uuids=[r['photo_uuid'] for r in con.execute('SELECT photo_uuid FROM cloud_photos WHERE id IN (%s)' % ','.join('?'*len(ids)),ids).fetchall()]
changes=[]
if uuids:
    qq='SELECT id,photo_uuid,action,payload_json,actor_account_id,created_at FROM mobile_photo_changes WHERE photo_uuid IN (%s) ORDER BY id' % ','.join('?'*len(uuids))
    for r in con.execute(qq,uuids).fetchall():
        p={}
        try: p=json.loads(r['payload_json'] or '{}')
        except Exception: pass
        changes.append({'id':r['id'],'uuid_hash':h(r['photo_uuid']),'action':r['action'],'actor_account_id':r['actor_account_id'],'created_at':r['created_at'],'payload_keys':sorted(p.keys()),'local_project_code':p.get('local_project_code'),'local_photo_id':p.get('local_photo_id')})
print('changes='+json.dumps(changes,ensure_ascii=True))
'@
          $encoded=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($py))
          $cmd="import base64;exec(base64.b64decode('$encoded'))"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i $key root@47.95.221.66 "python3 -c `"$cmd`""
          if ($LASTEXITCODE -ne 0) { throw "readonly server query failed: $LASTEXITCODE" }
          Remove-Item -LiteralPath $dir -Recurse -Force
