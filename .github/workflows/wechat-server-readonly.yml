name: 云端手机照片全账号只读核对
on:
  push:
    branches:
      - chatgpt/wechat-desktop-sync-20260915
    paths:
      - .github/workflows/wechat-server-readonly.yml
permissions:
  contents: read
jobs:
  read:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 5
    env:
      SSH_KEY_B64: ${{ secrets.ALBUM_SSH_KEY_B64 }}
    steps:
      - name: Read production mobile state without writes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SSH_KEY_B64) { throw 'missing ssh diagnostic credential' }
          $dir = Join-Path $env:RUNNER_TEMP ('mobile-global-' + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $key = Join-Path $dir 'server_key'
          [IO.File]::WriteAllBytes($key,[Convert]::FromBase64String($env:SSH_KEY_B64))
          icacls $dir /inheritance:r /grant:r "$($env:USERNAME):(OI)(CI)F" | Out-Null
          $encoded = ' '
          $code = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($encoded))
          $code | ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i $key root@47.95.221.66 'python3 -'
          if ($LASTEXITCODE -ne 0) { throw "readonly server query failed: $LASTEXITCODE" }
          Remove-Item -LiteralPath $dir -Recurse -Force
