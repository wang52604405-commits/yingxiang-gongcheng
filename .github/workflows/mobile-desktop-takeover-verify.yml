name: 后台归档电脑接管修复验证
on:
  push:
    branches: [chatgpt/fix-mobile-desktop-takeover-20260915]
    paths:
      - tools/apply_mobile_desktop_takeover_fix.py
      - .github/workflows/mobile-desktop-takeover-verify.yml
permissions:
  contents: write
env:
  PYTHONUTF8: '1'
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/fix-mobile-desktop-takeover-20260915
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            server/requirements.txt
      - name: 安装依赖
        run: python -m pip install -r requirements.txt -r server/requirements.txt
      - name: 应用后台接管补丁
        run: python tools/apply_mobile_desktop_takeover_fix.py
      - name: 运行移动同步服务器契约测试
        run: python -m unittest discover -s tests -p test_mobile_server.py -v
      - name: 运行全部 Python 回归
        run: python -m unittest discover -s tests -v
      - name: 编译和补丁检查
        shell: pwsh
        run: |
          python -m compileall -q server tests/test_mobile_server.py
          git diff --check
          git diff --exit-code -- server/mobile_api.py tests/test_mobile_server.py | Out-Host
          if ($LASTEXITCODE -eq 0) { throw '补丁没有产生业务改动' }
          exit 0
      - name: 提交验证通过的修复到功能分支
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/mobile_api.py tests/test_mobile_server.py
          git commit -m '允许新归档电脑接收服务器待归档照片'
          git push origin HEAD:chatgpt/fix-mobile-desktop-takeover-20260915
