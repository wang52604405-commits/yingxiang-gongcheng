name: 缩略图原图一致性修复验证
on:
  push:
    branches:
      - chatgpt/fix-photo-thumb-original-mismatch-20260915
    paths:
      - tools/apply_thumbnail_consistency_fix.py
      - .github/workflows/verify-thumbnail-consistency-fix.yml
permissions:
  contents: write
env:
  PYTHONUTF8: '1'
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            server/requirements.txt
      - name: 安装依赖
        run: python -m pip install -r requirements.txt -r server/requirements.txt
      - name: 应用缩略图一致性修复
        run: python tools/apply_thumbnail_consistency_fix.py
      - name: 运行缩略图专项回归
        run: python -m unittest tests.test_thumbnail_consistency -v
      - name: 运行全部 Python 回归
        run: python -m unittest discover -s tests -v
      - name: 编译与空白检查
        shell: pwsh
        run: |
          python -m compileall -q app.py tests/test_thumbnail_consistency.py
          git diff --check
      - name: 清理临时诊断与补丁脚本
        shell: pwsh
        run: |
          Remove-Item -LiteralPath 'tools/apply_thumbnail_consistency_fix.py' -Force
          Remove-Item -LiteralPath 'tools/diag_photo_mismatch_readonly.py' -Force
          Remove-Item -LiteralPath '.github/workflows/diag-photo-mismatch.yml' -Force
          Remove-Item -LiteralPath '.github/workflows/verify-thumbnail-consistency-fix.yml' -Force
      - name: 提交验证通过的正式修复
        shell: pwsh
        run: |
          git config user.name 'wang52604405-commits'
          git config user.email 'wang52604405@gmail.com'
          git add -A
          git diff --cached --check
          if (git diff --cached --quiet) { throw '验证后没有正式改动可提交' }
          git commit -m 'fix: keep thumbnails bound to current photo source'
          git push origin HEAD:chatgpt/fix-photo-thumb-original-mismatch-20260915
