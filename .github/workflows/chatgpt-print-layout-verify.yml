name: ChatGPT Print Layout Verify

on:
  push:
    branches:
      - chatgpt/print-grid-autofill-20260909
    paths:
      - tools/chatgpt_print_patch_20260909.py
      - tools/chatgpt_print_patch_fix_runner.py
      - .github/workflows/chatgpt-print-layout-verify.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 20
    env:
      HTTPS_PROXY: http://127.0.0.1:7897
      HTTP_PROXY: http://127.0.0.1:7897
      ALL_PROXY: http://127.0.0.1:7897
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - name: 检出功能分支
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 应用受控打印补丁
        shell: powershell
        run: python tools/chatgpt_print_patch_fix_runner.py

      - name: 打印专项回归
        shell: powershell
        run: python -m unittest discover -s tests -p "test_z_print_layout_modes.py" -v

      - name: 全量回归
        shell: powershell
        run: python -m unittest discover -s tests -v

      - name: 准备临时发布校验凭据
        shell: powershell
        env:
          SIGN_KEY_B64: ${{ secrets.ALBUM_SIGN_KEY_B64 }}
          SSH_KEY_B64: ${{ secrets.ALBUM_SSH_KEY_B64 }}
        run: |
          if (-not $env:SIGN_KEY_B64 -or -not $env:SSH_KEY_B64) { throw "缺少发布校验密钥 Secret" }
          $credentialDir = Join-Path $env:RUNNER_TEMP "album-print-verify-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $credentialDir -Force | Out-Null
          $signKey = Join-Path $credentialDir "release_guard_private_key.pem"
          $sshKey = Join-Path $credentialDir "server_key"
          [IO.File]::WriteAllBytes($signKey, [Convert]::FromBase64String($env:SIGN_KEY_B64))
          [IO.File]::WriteAllBytes($sshKey, [Convert]::FromBase64String($env:SSH_KEY_B64))
          icacls $credentialDir /inheritance:r /grant:r "$($env:USERNAME):(OI)(CI)F" | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "ALBUM_SIGN_KEY=$signKey"
          Add-Content -Path $env:GITHUB_ENV -Value "ALBUM_SSH_KEY=$sshKey"
          Add-Content -Path $env:GITHUB_ENV -Value "ALBUM_PRINT_VERIFY_CREDENTIAL_DIR=$credentialDir"

      - name: 发布完整性校验
        shell: powershell
        run: python verify_release.py

      - name: 提交已验证正式改动
        shell: powershell
        run: |
          git config user.name "wang52604405-commits"
          git config user.email "wang52604405@gmail.com"
          git rm -f --ignore-unmatch tools/chatgpt_print_patch_20260909.py tools/chatgpt_print_patch_fix_runner.py .github/workflows/chatgpt-print-layout-verify.yml
          git add -A
          if (git diff --cached --quiet) {
            Write-Host "NO_CHANGES_TO_COMMIT"
            exit 0
          }
          git commit -m "feat: simplify A4 print layouts and separate labels"
          git push origin HEAD:chatgpt/print-grid-autofill-20260909

      - name: 清理临时发布校验凭据
        if: always()
        shell: powershell
        run: |
          if ($env:ALBUM_PRINT_VERIFY_CREDENTIAL_DIR -and (Test-Path -LiteralPath $env:ALBUM_PRINT_VERIFY_CREDENTIAL_DIR)) {
            Remove-Item -LiteralPath $env:ALBUM_PRINT_VERIFY_CREDENTIAL_DIR -Recurse -Force
          }
