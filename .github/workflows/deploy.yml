name: 自动部署 5088 + 发布客户更新

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # 本机自托管 runner（登录时启动的计划任务，以 Administrator 账户运行），
    # 构建+签名+替换+重启+发布安装包都在本机完成，权限与手动操作一致
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30
    env:
      # 本机走代理才能访问 GitHub（Clash 7897），checkout 也要用代理
      HTTPS_PROXY: http://127.0.0.1:7897
      HTTP_PROXY: http://127.0.0.1:7897
      ALL_PROXY: http://127.0.0.1:7897
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 递增版本号
        shell: powershell
        run: |
          python bump_version.py

      - name: 构建并部署 5088
        shell: powershell
        env:
          # 私钥留在本机（E:\use\keys），只以环境变量注入，绝不上传到仓库或 Secrets
          ALBUM_SIGN_KEY: E:\use\keys\private_key.pem
          ALBUM_INSTALL_DIR: C:\Users\Administrator\AppData\Local\工程影像管理平台
          ALBUM_DATA_DIR: D:\工程影像资料
          ALBUM_PORT: "5088"
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\deploy_prod.ps1

      - name: 发布安装包到更新通道
        shell: powershell
        env:
          # SKIP_BUILD=1：deploy_prod.ps1 已构建 dist 并签名，此处直接打 Inno 安装包
          SKIP_BUILD: "1"
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          python publish_update.py

  # 授权中心自动部署：仅当 server/** 代码变更时触发
  deploy-auth:
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 10
    if: ${{ github.event_name == 'workflow_dispatch' || contains(join(github.event.commits.*.modified, ','), 'server/') }}
    env:
      HTTPS_PROXY: http://127.0.0.1:7897
      HTTP_PROXY: http://127.0.0.1:7897
      ALL_PROXY: http://127.0.0.1:7897
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 部署授权中心到阿里云
        shell: powershell
        run: |
          python deploy_auth.py
