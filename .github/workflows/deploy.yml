name: 自动部署 5088 + 发布客户更新

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/photo-sync-diagnostic.yml"
      - ".diag/**"
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # 完整回归放到 GitHub 托管 Windows 上运行，避免生产电脑上的后台服务、
  # 微信工具或本地 SQLite I/O 干扰并发测试。只有托管回归全部通过，
  # 才允许唯一的生产 Windows Runner 接手签名、5088 部署和安装包发布。
  validate:
    name: 发布前完整回归
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      # GitHub 托管 Windows 的默认控制台可能是 cp1252；测试中的中文日志
      # 必须固定为 UTF-8，否则仅打印重试提示就会触发 UnicodeEncodeError。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            server/requirements.txt

      - name: 安装依赖
        shell: powershell
        run: python -m pip install -r requirements.txt -r server/requirements.txt

      - name: 运行完整 Python 回归
        shell: powershell
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "unit tests failed: exit code $LASTEXITCODE" }

      - name: 编译检查
        shell: powershell
        run: |
          python -m compileall -q app.py cloud_client.py mobile_sync.py mobile_sync_reconcile.py validate_mobile_migration.py tests/run_mobile_staging_e2e.py server
          if ($LASTEXITCODE -ne 0) { throw "compile check failed: exit code $LASTEXITCODE" }
          git diff --check HEAD
          if ($LASTEXITCODE -ne 0) { throw "git diff check failed: exit code $LASTEXITCODE" }

  # 授权中心自动部署：仅当 server/** 代码变更时触发。
  # 这里不再重复跑 189 项完整回归；validate 已在隔离的托管 Windows 完成。
  deploy-auth:
    needs: validate
    if: github.ref == 'refs/heads/main' && needs.validate.result == 'success'
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30
    env:
      ALBUM_SERVER_HOST: ${{ secrets.ALBUM_SERVER_HOST }}
      HTTPS_PROXY: http://127.0.0.1:7897
      HTTP_PROXY: http://127.0.0.1:7897
      ALL_PROXY: http://127.0.0.1:7897
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - name: 下载本次提交的源码
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $workspace = $env:GITHUB_WORKSPACE
          if (-not $workspace) { throw 'GITHUB_WORKSPACE is not set' }
          if (-not $env:RUNNER_TEMP) { throw 'RUNNER_TEMP is not set' }
          New-Item -ItemType Directory -Path $workspace -Force | Out-Null
          Get-ChildItem -LiteralPath $workspace -Force | Remove-Item -Recurse -Force

          $zipPath = Join-Path $env:RUNNER_TEMP 'source-${{ github.sha }}.zip'
          $url = 'https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip'
          if (Test-Path -LiteralPath $zipPath) { Remove-Item -LiteralPath $zipPath -Force }
          $downloaded = $false
          foreach ($attempt in 1..5) {
            & curl.exe -fsSL --ssl-no-revoke -o $zipPath $url
            if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $zipPath)) {
              $downloaded = $true
              break
            }
            if (Test-Path -LiteralPath $zipPath) { Remove-Item -LiteralPath $zipPath -Force }
            Start-Sleep -Seconds (2 * $attempt)
          }
          if (-not $downloaded) { throw 'Failed to download the source zip' }

          # Expand-Archive mangles non-ASCII names. Extract with tar, then move the repo root into the workspace.
          $tar = Join-Path $env:SystemRoot 'System32\tar.exe'
          if (-not (Test-Path -LiteralPath $tar)) { throw 'Windows tar.exe was not found' }
          & $tar -xf $zipPath -C $workspace
          if ($LASTEXITCODE -ne 0) { throw ('Failed to extract the source zip: exit code ' + $LASTEXITCODE) }

          $entries = @(Get-ChildItem -LiteralPath $workspace -Force)
          if ($entries.Count -eq 1 -and $entries[0].PSIsContainer) {
            $root = $entries[0].FullName
            Get-ChildItem -LiteralPath $root -Force | ForEach-Object {
              Move-Item -LiteralPath $_.FullName -Destination $workspace -Force
            }
            Remove-Item -LiteralPath $root -Force
          }

          # Installer script name is built from code points so this file stays ASCII for Windows PowerShell 5.x.
          $installerScript = [string]::Concat([char]0x5B89, [char]0x88C5, [char]0x811A, [char]0x672C, '.iss')
          foreach ($required in @('prepare_release_version.py', $installerScript)) {
            if (-not (Test-Path -LiteralPath (Join-Path $workspace $required))) {
              throw ('Extracted workspace is missing ' + $required)
            }
          }
          Remove-Item -LiteralPath $zipPath -Force

      - name: 生成本次桌面发布版本
        shell: powershell
        run: |
          python prepare_release_version.py
          if ($LASTEXITCODE -ne 0) { throw "release version preparation failed: exit code $LASTEXITCODE" }

      - name: 准备临时服务器凭据
        shell: powershell
        env:
          SIGN_KEY_B64: ${{ secrets.ALBUM_SIGN_KEY_B64 }}
          SSH_KEY_B64: ${{ secrets.ALBUM_SSH_KEY_B64 }}
        run: |
          if (-not $env:SIGN_KEY_B64 -or -not $env:SSH_KEY_B64) { throw 'Missing release or server secret' }
          $credentialDir = Join-Path $env:RUNNER_TEMP "album-release-$env:GITHUB_RUN_ID-$env:GITHUB_JOB"
          New-Item -ItemType Directory -Path $credentialDir -Force | Out-Null
          $signKey = Join-Path $credentialDir "release_guard_private_key.pem"
          $sshKey = Join-Path $credentialDir "server_key"
          [IO.File]::WriteAllBytes($signKey, [Convert]::FromBase64String($env:SIGN_KEY_B64))
          [IO.File]::WriteAllBytes($sshKey, [Convert]::FromBase64String($env:SSH_KEY_B64))
          icacls $credentialDir /inheritance:r /grant:r "$($env:USERNAME):(OI)(CI)F" | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "ALBUM_SIGN_KEY=$signKey"
          Add-Content -Path $env:GITHUB_ENV -Value "ALBUM_SSH_KEY=$sshKey"
          Add-Content -Path $env:GITHUB_ENV -Value "ALBUM_CREDENTIAL_DIR=$credentialDir"

      - name: 校验发布版本与密钥
        shell: powershell
        run: |
          python -c "from pathlib import Path; files=list(Path('assets').glob('app-A*.js'))+list(Path('assets').glob('app-A*.css')); [p.write_bytes(p.read_bytes().replace(b'\r\n', b'\n')) for p in files]"
          if ($LASTEXITCODE -ne 0) { throw "asset line-ending normalization failed: exit code $LASTEXITCODE" }
          python verify_release.py
          if ($LASTEXITCODE -ne 0) { throw "verify_release failed: exit code $LASTEXITCODE" }

      - name: 判断是否需要部署服务器
        id: check
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $changed = $true
          } else {
            $before = "${{ github.event.before }}"
            $compareOk = $false
            if ($before -match '^[0-9a-fA-F]{40}$' -and $before -notmatch '^0+$') {
              # git fetch on this machine is reset by the proxy. List changed files with the compare API via curl.
              $api = "https://api.github.com/repos/${{ github.repository }}/compare/${before}...$env:GITHUB_SHA"
              $jsonPath = Join-Path $env:RUNNER_TEMP "compare-$env:GITHUB_RUN_ID.json"
              $downloaded = $false
              foreach ($attempt in 1..3) {
                & curl.exe -fsSL --ssl-no-revoke -H "Authorization: Bearer $env:GITHUB_TOKEN" -H "Accept: application/vnd.github+json" -H "User-Agent: yingxiang-gongcheng-deploy" -o $jsonPath $api
                if ($LASTEXITCODE -eq 0) { $downloaded = $true; break }
                Start-Sleep -Seconds (2 * $attempt)
              }
              if ($downloaded) {
                try {
                  $raw = [IO.File]::ReadAllText($jsonPath, [Text.UTF8Encoding]::new($false))
                  $compare = $raw | ConvertFrom-Json
                  $compareOk = $true
                } catch {
                  Write-Warning "Unable to compare the pushed range; deploying server fail-safe."
                }
              } else {
                Write-Warning "Unable to compare the pushed range; deploying server fail-safe."
              }
            } else {
              Write-Warning "Unable to compare the pushed range; deploying server fail-safe."
            }
            if (-not $compareOk) {
              $changed = $true
            } else {
              $fileCount = 0
              $changedFiles = @()
              if ($compare.files) {
                $fileCount = @($compare.files).Count
                $changedFiles = @(
                  $compare.files | ForEach-Object {
                    if ($_.filename) { $_.filename }
                    if ($_.previous_filename) { $_.previous_filename }
                  }
                )
              }
              if ($fileCount -ge 300) {
                Write-Warning "Compare file list reached the API cap; deploying server fail-safe."
                $changed = $true
              } else {
                $changed = $changedFiles |
                  Select-String '^(server/|deploy_auth\.py$|validate_mobile_migration\.py$|\.github/workflows/deploy\.yml$)'
              }
            }
          }
          if ($changed) {
            Write-Host "Server deployment is required."
            [IO.File]::AppendAllText(
              $env:GITHUB_OUTPUT,
              "run_deploy=true`n",
              [Text.UTF8Encoding]::new($false)
            )
          } else {
            Write-Host "No server deployment is required."
            [IO.File]::AppendAllText(
              $env:GITHUB_OUTPUT,
              "run_deploy=false`n",
              [Text.UTF8Encoding]::new($false)
            )
          }

      - name: 部署授权中心到阿里云
        if: steps.check.outputs.run_deploy == 'true'
        shell: powershell
        run: python deploy_auth.py

      - name: 清理临时服务器凭据
        if: always()
        shell: powershell
        run: |
          if ($env:ALBUM_CREDENTIAL_DIR -and (Test-Path -LiteralPath $env:ALBUM_CREDENTIAL_DIR)) {
            Remove-Item -LiteralPath $env:ALBUM_CREDENTIAL_DIR -Recurse -Force
          }

  deploy:
    needs: deploy-auth
    if: github.ref == 'refs/heads/main' && needs.deploy-auth.result == 'success'
    # 本机自托管 runner 只负责真正的生产发布，不再承担并发回归测试。
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30
    env:
      ALBUM_SERVER_HOST: ${{ secrets.ALBUM_SERVER_HOST }}
      HTTPS_PROXY: http://127.0.0.1:7897
      HTTP_PROXY: http://127.0.0.1:7897
      ALL_PROXY: http://127.0.0.1:7897
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - name: 下载本次提交的源码
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $workspace = $env:GITHUB_WORKSPACE
          if (-not $workspace) { throw 'GITHUB_WORKSPACE is not set' }
          if (-not $env:RUNNER_TEMP) { throw 'RUNNER_TEMP is not set' }
          New-Item -ItemType Directory -Path $workspace -Force | Out-Null
          Get-ChildItem -LiteralPath $workspace -Force | Remove-Item -Recurse -Force

          $zipPath = Join-Path $env:RUNNER_TEMP 'source-${{ github.sha }}.zip'
          $url = 'https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip'
          if (Test-Path -LiteralPath $zipPath) { Remove-Item -LiteralPath $zipPath -Force }
          $downloaded = $false
          foreach ($attempt in 1..5) {
            & curl.exe -fsSL --ssl-no-revoke -o $zipPath $url
            if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $zipPath)) {
              $downloaded = $true
              break
            }
            if (Test-Path -LiteralPath $zipPath) { Remove-Item -LiteralPath $zipPath -Force }
            Start-Sleep -Seconds (2 * $attempt)
          }
          if (-not $downloaded) { throw 'Failed to download the source zip' }

          # Expand-Archive mangles non-ASCII names. Extract with tar, then move the repo root into the workspace.
          $tar = Join-Path $env:SystemRoot 'System32\tar.exe'
          if (-not (Test-Path -LiteralPath $tar)) { throw 'Windows tar.exe was not found' }
          & $tar -xf $zipPath -C $workspace
          if ($LASTEXITCODE -ne 0) { throw ('Failed to extract the source zip: exit code ' + $LASTEXITCODE) }

          $entries = @(Get-ChildItem -LiteralPath $workspace -Force)
          if ($entries.Count -eq 1 -and $entries[0].PSIsContainer) {
            $root = $entries[0].FullName
            Get-ChildItem -LiteralPath $root -Force | ForEach-Object {
              Move-Item -LiteralPath $_.FullName -Destination $workspace -Force
            }
            Remove-Item -LiteralPath $root -Force
          }

          # Installer script name is built from code points so this file stays ASCII for Windows PowerShell 5.x.
          $installerScript = [string]::Concat([char]0x5B89, [char]0x88C5, [char]0x811A, [char]0x672C, '.iss')
          foreach ($required in @('prepare_release_version.py', $installerScript)) {
            if (-not (Test-Path -LiteralPath (Join-Path $workspace $required))) {
              throw ('Extracted workspace is missing ' + $required)
            }
          }
          Remove-Item -LiteralPath $zipPath -Force

      - name: 生成本次桌面发布版本
        shell: powershell
        run: |
          python prepare_release_version.py
          if ($LASTEXITCODE -ne 0) { throw "release version preparation failed: exit code $LASTEXITCODE" }

      - name: 准备临时发布凭据
        shell: powershell
        env:
          SIGN_KEY_B64: ${{ secrets.ALBUM_SIGN_KEY_B64 }}
          SSH_KEY_B64: ${{ secrets.ALBUM_SSH_KEY_B64 }}
        run: |
          if (-not $env:SIGN_KEY_B64 -or -not $env:SSH_KEY_B64) { throw 'Missing release secrets' }
          $credentialDir = Join-Path $env:RUNNER_TEMP "album-release-$env:GITHUB_RUN_ID-$env:GITHUB_JOB"
          New-Item -ItemType Directory -Path $credentialDir -Force | Out-Null
          $signKey = Join-Path $credentialDir "release_guard_private_key.pem"
          $sshKey = Join-Path $credentialDir "server_key"
          [IO.File]::WriteAllBytes($signKey, [Convert]::FromBase64String($env:SIGN_KEY_B64))
          [IO.File]::WriteAllBytes($sshKey, [Convert]::FromBase64String($env:SSH_KEY_B64))
          icacls $credentialDir /inheritance:r /grant:r "$($env:USERNAME):(OI)(CI)F" | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "ALBUM_SIGN_KEY=$signKey"
          Add-Content -Path $env:GITHUB_ENV -Value "ALBUM_SSH_KEY=$sshKey"
          Add-Content -Path $env:GITHUB_ENV -Value "ALBUM_CREDENTIAL_DIR=$credentialDir"

      - name: 校验发布版本与密钥
        shell: powershell
        run: |
          python -c "from pathlib import Path; files=list(Path('assets').glob('app-A*.js'))+list(Path('assets').glob('app-A*.css')); [p.write_bytes(p.read_bytes().replace(b'\r\n', b'\n')) for p in files]"
          if ($LASTEXITCODE -ne 0) { throw "asset line-ending normalization failed: exit code $LASTEXITCODE" }
          python verify_release.py
          if ($LASTEXITCODE -ne 0) { throw "verify_release failed: exit code $LASTEXITCODE" }

      - name: 构建并部署 5088
        shell: powershell
        env:
          ALBUM_INSTALL_DIR: C:\Users\Administrator\AppData\Local\工程影像管理平台
          ALBUM_DATA_DIR: D:\工程影像资料
          ALBUM_PORT: "5088"
          ALBUM_CLOUD_AUTO_USER: ${{ secrets.ALBUM_CLOUD_AUTO_USER }}
          ALBUM_CLOUD_AUTO_PASS: ${{ secrets.ALBUM_CLOUD_AUTO_PASS }}
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\deploy_prod.ps1

      - name: 发布安装包到更新通道
        shell: powershell
        env:
          SKIP_BUILD: "1"
          UPDATE_NOTE: ${{ github.event.head_commit.message }}
        run: |
          if ($env:UPDATE_NOTE) {
            $env:UPDATE_NOTE = (($env:UPDATE_NOTE -split '\r?\n')[0]).Trim()
          }
          Set-ExecutionPolicy -Scope Process Bypass -Force
          python publish_update.py

      - name: 清理临时发布凭据
        if: always()
        shell: powershell
        run: |
          if ($env:ALBUM_CREDENTIAL_DIR -and (Test-Path -LiteralPath $env:ALBUM_CREDENTIAL_DIR)) {
            Remove-Item -LiteralPath $env:ALBUM_CREDENTIAL_DIR -Recurse -Force
          }

  trigger-wechat-release:
    name: 触发微信发布包生成
    needs: deploy
    if: github.ref == 'refs/heads/main' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: 调用微信发布工作流
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'wechat-devtools-release.yml',
              ref: 'main',
              inputs: {
                source_sha: context.sha,
                source_ref: 'main'
              }
            })

  deploy-website:
    name: 发布四专业宣传网站
    needs: deploy
    if: github.ref == 'refs/heads/main' && needs.deploy.result == 'success'
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 15
    env:
      ALBUM_SERVER_HOST: ${{ secrets.ALBUM_SERVER_HOST }}
      HTTPS_PROXY: http://127.0.0.1:7897
      HTTP_PROXY: http://127.0.0.1:7897
      ALL_PROXY: http://127.0.0.1:7897
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - name: 下载本次提交的源码
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $workspace = $env:GITHUB_WORKSPACE
          if (-not $workspace) { throw 'GITHUB_WORKSPACE is not set' }
          if (-not $env:RUNNER_TEMP) { throw 'RUNNER_TEMP is not set' }
          New-Item -ItemType Directory -Path $workspace -Force | Out-Null
          Get-ChildItem -LiteralPath $workspace -Force | Remove-Item -Recurse -Force

          $zipPath = Join-Path $env:RUNNER_TEMP 'source-${{ github.sha }}.zip'
          $url = 'https://github.com/${{ github.repository }}/archive/${{ github.sha }}.zip'
          if (Test-Path -LiteralPath $zipPath) { Remove-Item -LiteralPath $zipPath -Force }
          $downloaded = $false
          foreach ($attempt in 1..5) {
            & curl.exe -fsSL --ssl-no-revoke -o $zipPath $url
            if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath $zipPath)) {
              $downloaded = $true
              break
            }
            if (Test-Path -LiteralPath $zipPath) { Remove-Item -LiteralPath $zipPath -Force }
            Start-Sleep -Seconds (2 * $attempt)
          }
          if (-not $downloaded) { throw 'Failed to download the source zip' }

          # Expand-Archive mangles non-ASCII names. Extract with tar, then move the repo root into the workspace.
          $tar = Join-Path $env:SystemRoot 'System32\tar.exe'
          if (-not (Test-Path -LiteralPath $tar)) { throw 'Windows tar.exe was not found' }
          & $tar -xf $zipPath -C $workspace
          if ($LASTEXITCODE -ne 0) { throw ('Failed to extract the source zip: exit code ' + $LASTEXITCODE) }

          $entries = @(Get-ChildItem -LiteralPath $workspace -Force)
          if ($entries.Count -eq 1 -and $entries[0].PSIsContainer) {
            $root = $entries[0].FullName
            Get-ChildItem -LiteralPath $root -Force | ForEach-Object {
              Move-Item -LiteralPath $_.FullName -Destination $workspace -Force
            }
            Remove-Item -LiteralPath $root -Force
          }

          # Installer script name is built from code points so this file stays ASCII for Windows PowerShell 5.x.
          $installerScript = [string]::Concat([char]0x5B89, [char]0x88C5, [char]0x811A, [char]0x672C, '.iss')
          foreach ($required in @('prepare_release_version.py', $installerScript)) {
            if (-not (Test-Path -LiteralPath (Join-Path $workspace $required))) {
              throw ('Extracted workspace is missing ' + $required)
            }
          }
          Remove-Item -LiteralPath $zipPath -Force

      - name: 准备临时服务器凭据
        shell: powershell
        env:
          SSH_KEY_B64: ${{ secrets.ALBUM_SSH_KEY_B64 }}
        run: |
          if (-not $env:SSH_KEY_B64) { throw 'Missing server secret' }
          $credentialDir = Join-Path $env:RUNNER_TEMP "album-site-$env:GITHUB_RUN_ID-$env:GITHUB_JOB"
          New-Item -ItemType Directory -Path $credentialDir -Force | Out-Null
          $sshKey = Join-Path $credentialDir "server_key"
          [IO.File]::WriteAllBytes($sshKey, [Convert]::FromBase64String($env:SSH_KEY_B64))
          icacls $credentialDir /inheritance:r /grant:r "$($env:USERNAME):(OI)(CI)F" | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "ALBUM_SSH_KEY=$sshKey"
          Add-Content -Path $env:GITHUB_ENV -Value "ALBUM_SITE_CREDENTIAL_DIR=$credentialDir"

      - name: 校验并发布网站
        shell: powershell
        run: python deploy_website.py

      - name: 清理临时服务器凭据
        if: always()
        shell: powershell
        run: |
          if ($env:ALBUM_SITE_CREDENTIAL_DIR -and (Test-Path -LiteralPath $env:ALBUM_SITE_CREDENTIAL_DIR)) {
            Remove-Item -LiteralPath $env:ALBUM_SITE_CREDENTIAL_DIR -Recurse -Force
          }
