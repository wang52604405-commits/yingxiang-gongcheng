name: 自动部署到 5088

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # 本机自托管 runner（登录时启动的计划任务，以 Administrator 账户运行），
    # 构建+签名+替换+重启都在本机完成，权限与手动操作一致
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建并部署
        shell: powershell
        env:
          # 私钥留在本机（E:\use\keys），只以环境变量注入，绝不上传到仓库或 Secrets
          ALBUM_SIGN_KEY: E:\use\keys\private_key.pem
          ALBUM_INSTALL_DIR: C:\Users\Administrator\AppData\Local\工程影像管理平台
          ALBUM_DATA_DIR: D:\工程影像资料
          ALBUM_PORT: "5088"
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\deploy_prod.ps1
