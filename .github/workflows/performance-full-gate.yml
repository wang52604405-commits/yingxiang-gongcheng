name: 性能优化五轮验收
on:
  push:
    branches: [chatgpt/performance-full-20260914]
permissions:
  contents: read
concurrency:
  group: performance-full-isolated
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare isolated candidate
        id: candidate
        shell: bash
        run: |
          if [ -f .diag/perf_patch.py ]; then
            python .diag/perf_patch.py
            rm .diag/perf_patch.py
            python -c "from pathlib import Path; import gzip; p=next(Path('assets').glob('app-A*.js')); p.with_suffix('.js.gz').write_bytes(gzip.compress(p.read_bytes(),mtime=0))"
            node --check assets/app-A20260910-2.92.js
            git diff --check
            git add app.py assets/app-A20260910-2.92.js assets/app-A20260910-2.92.js.gz tests .diag/perf_patch.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m '加快照片浏览与切换并完善连续操作保护'
            git push origin HEAD:chatgpt/performance-full-20260914
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p evidence
          git archive --format=zip --output=evidence/source.zip HEAD
          git rev-parse HEAD > evidence/source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: performance-candidate-source
          path: evidence
          retention-days: 7
  round:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        round: [1]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install isolated validation dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt -r server/requirements.txt playwright pymupdf
          if ($LASTEXITCODE -ne 0) { throw 'dependencies failed' }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'browser install failed' }
      - name: Full regression and browser end-to-end
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path evidence -Force | Out-Null
          git rev-parse HEAD | Set-Content evidence/source-sha.txt
          python -m unittest discover -s tests -v *> evidence/python-tests.log
          $testsCode=$LASTEXITCODE
          python -m compileall -q app.py tests server
          $compileCode=$LASTEXITCODE
          node --check assets/app-A20260910-2.92.js
          $jsCode=$LASTEXITCODE
          python tests/run_performance_browser.py --round ${{ matrix.round }} --out-dir evidence/browser *> evidence/browser.log
          $browserCode=$LASTEXITCODE
          if ($testsCode -ne 0 -or $compileCode -ne 0 -or $jsCode -ne 0 -or $browserCode -ne 0) {
            Get-Content evidence/python-tests.log -Tail 65
            Get-Content evidence/browser.log -Tail 75
            throw "validation failed: python=$testsCode compile=$compileCode js=$jsCode browser=$browserCode"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-round-${{ matrix.round }}
          path: evidence
          retention-days: 7
