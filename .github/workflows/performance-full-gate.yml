name: 性能优化五轮验收
on:
  push:
    branches: [chatgpt/performance-full-20260914]
permissions:
  contents: read
concurrency:
  group: performance-full-isolated
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Prepare isolated candidate
        id: candidate
        shell: bash
        run: |
          if [ -f .diag/perf_patch.py ]; then
            python .diag/perf_patch.py
            rm .diag/perf_patch.py
            python -c "from pathlib import Path; import gzip; p=next(Path('assets').glob('app-A*.js')); p.with_suffix('.js.gz').write_bytes(gzip.compress(p.read_bytes(),mtime=0))"
            node --check assets/app-A20260910-2.92.js
            git diff --check
            git add app.py assets/app-A20260910-2.92.js assets/app-A20260910-2.92.js.gz tests .diag/perf_patch.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m '加快照片浏览与切换并完善连续操作保护'
            git push origin HEAD:chatgpt/performance-full-20260914
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p evidence
          git archive --format=zip --output=evidence/source.zip HEAD
          git rev-parse HEAD > evidence/source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: performance-candidate-source
          path: evidence
          retention-days: 7
  round:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        round: [1]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install isolated validation dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt -r server/requirements.txt playwright pymupdf
          if ($LASTEXITCODE -ne 0) { throw 'dependencies failed' }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'browser install failed' }
      - name: Full regression and bounded browser end-to-end
        shell: python
        run: |
          import json,subprocess,sys
          from pathlib import Path
          out=Path('evidence');out.mkdir(exist_ok=True)
          (out/'source-sha.txt').write_bytes(subprocess.check_output(['git','rev-parse','HEAD']))
          results={}
          commands=[
            ('python-tests',[sys.executable,'-u','-m','unittest','discover','-s','tests','-v'],180),
            ('compile',[sys.executable,'-m','compileall','-q','app.py','tests','server'],60),
            ('javascript',['node','--check','assets/app-A20260910-2.92.js'],60),
            ('browser',[sys.executable,'-u','tests/run_performance_browser.py','--round','${{ matrix.round }}','--out-dir','evidence/browser'],240),
          ]
          for name,cmd,timeout in commands:
            print('START',name,flush=True)
            with (out/(name+'.log')).open('wb') as log:
              try: results[name]=subprocess.run(cmd,stdout=log,stderr=subprocess.STDOUT,timeout=timeout).returncode
              except subprocess.TimeoutExpired: results[name]='timeout'
            print('RESULT',name,results[name],flush=True)
            print((out/(name+'.log')).read_text(encoding='utf-8',errors='replace')[-12000:],flush=True)
          (out/'gate-results.json').write_text(json.dumps(results,indent=2),encoding='utf-8')
          if any(code!=0 for code in results.values()):raise SystemExit(1)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-round-${{ matrix.round }}
          path: evidence
          retention-days: 7
