name: ChatGPT Asset EOL Verify

on:
  push:
    branches:
      - chatgpt/fix-asset-eol-20260909

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - name: Verify checkout attributes
        shell: pwsh
        run: |
          git check-attr -a -- assets/app-A20260909-2.90.js assets/app-A20260909-2.90.css
          $jsAttr = git check-attr text -- assets/app-A20260909-2.90.js
          $cssAttr = git check-attr text -- assets/app-A20260909-2.90.css
          if ($jsAttr -notmatch 'text: unset') { throw "JS_TEXT_ATTRIBUTE_NOT_UNSET: $jsAttr" }
          if ($cssAttr -notmatch 'text: unset') { throw "CSS_TEXT_ATTRIBUTE_NOT_UNSET: $cssAttr" }

      - name: Regenerate deterministic gzip from canonical source bytes
        shell: pwsh
        run: |
          @'
          import gzip
          from pathlib import Path

          for name in ("app-A20260909-2.90.js", "app-A20260909-2.90.css"):
              source = Path("assets") / name
              packed = Path("assets") / f"{name}.gz"
              raw = source.read_bytes()
              if b"\r\n" in raw:
                  raise SystemExit(f"CRLF_PRESENT_IN_CANONICAL_SOURCE {name}")
              packed.write_bytes(gzip.compress(raw, compresslevel=9, mtime=0))
              inflated = gzip.decompress(packed.read_bytes())
              if raw != inflated:
                  raise SystemExit(f"BYTE_MISMATCH_AFTER_REBUILD {name}")
              print(f"BYTE_MATCH {name} bytes={len(raw)}")
          '@ | python -

      - name: Commit canonical gzip payload when needed
        shell: pwsh
        run: |
          git config user.name "wang52604405-commits"
          git config user.email "wang52604405@gmail.com"
          git add assets/app-A20260909-2.90.js.gz assets/app-A20260909-2.90.css.gz
          if (git diff --cached --quiet) {
            Write-Host "GZIP_ALREADY_CANONICAL"
            exit 0
          }
          git commit -m "fix: rebuild 2.90 compressed assets from canonical bytes"
          git push origin HEAD:chatgpt/fix-asset-eol-20260909
