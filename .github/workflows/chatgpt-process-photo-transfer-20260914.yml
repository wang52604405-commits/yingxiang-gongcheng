name: ChatGPT process photo transfer patch

on:
  push:
    branches:
      - chatgpt/process-photo-transfer-fix-20260914

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Apply focused patch
        run: python tools/chatgpt_patch_process_photo_transfer_20260914.py
      - name: Focused regression
        run: python -m unittest tests.test_process_photo_transfer -v
      - name: Compile check
        run: python -m py_compile app.py tests/test_process_photo_transfer.py
      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py templates/index.html assets/app-A*.js tests/test_process_photo_transfer.py tools/chatgpt_patch_process_photo_transfer_20260914.py .github/workflows/chatgpt-process-photo-transfer-20260914.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: move photos between processes and fix empty-process deletion [skip ci]"
          git push origin HEAD:chatgpt/process-photo-transfer-fix-20260914
